<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Квиз-Рулетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg: #0b0d17;
    --card: #151827;
    --border: rgba(255,255,255,0.07);
    --accent: #7c5cff;
    --accent2: #ff5c9d;
    --gold: #ffc93c;
    --text: #fff;
    --text2: rgba(255,255,255,0.65);
    --text3: rgba(255,255,255,0.4);
    --success: #2ee68e;
    --danger: #ff4d6d;
  }
  html, body { overscroll-behavior-y: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 30px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; top: -200px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,92,255,0.25) 0%, transparent 65%);
    pointer-events: none; z-index: 0; filter: blur(60px);
  }
  body::after {
    content: ''; position: fixed; bottom: -200px; left: -100px;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(255,92,157,0.18) 0%, transparent 65%);
    pointer-events: none; z-index: 0; filter: blur(60px);
  }

  /* Topbar */
  .topbar {
    position: sticky; top: 0;
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    background: rgba(11,13,23,0.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 18px; font-weight: 900; letter-spacing: -0.4px;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #ff5c9d);
    box-shadow: 0 0 12px rgba(124,92,255,0.7);
  }

  .main { position: relative; z-index: 2; padding: 16px; }

  /* Balance card */
  .balance-card {
    background: linear-gradient(135deg, rgba(124,92,255,0.15), rgba(255,92,157,0.1));
    border: 1px solid rgba(124,92,255,0.3);
    border-radius: 20px;
    padding: 20px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .balance-left { display: flex; align-items: center; gap: 12px; }
  .balance-icon { font-size: 40px; }
  .balance-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
  .balance-value { font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1; margin-top: 2px; }
  .balance-value .star { color: var(--gold); }

  /* Energy bar */
  .energy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .energy-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
    font-size: 13px; font-weight: 800;
  }
  .energy-top .label { color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .energy-top .val { color: var(--gold); }
  .energy-bar {
    height: 8px; background: rgba(255,255,255,0.08);
    border-radius: 8px; overflow: hidden;
  }
  .energy-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffc93c, #ff5c9d);
    border-radius: 8px;
    transition: width .3s;
    box-shadow: 0 0 12px rgba(255,201,60,0.5);
  }

  /* Tabs */
  .tabs {
    display: flex; gap: 6px;
    background: var(--card); padding: 5px;
    border-radius: 16px; margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px;
    border-radius: 12px; font-size: 12px; font-weight: 800;
    color: var(--text3); cursor: pointer; transition: all .2s;
  }
  .tab.active {
    background: linear-gradient(135deg, #7c5cff, #6647e0);
    color: #fff;
    box-shadow: 0 6px 16px rgba(124,92,255,0.35);
  }

  /* Big spin button */
  .spin-wrap {
    text-align: center;
    padding: 30px 0;
  }
  .spin-btn {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #a78bfa, #7c5cff 60%, #4c1d95);
    border: none;
    color: #fff;
    font-size: 60px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 0 60px rgba(124,92,255,0.6), 0 0 120px rgba(124,92,255,0.3), inset 0 -10px 30px rgba(0,0,0,0.3);
    transition: transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .spin-btn:active { transform: scale(0.94); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .spin-btn::before {
    content: '';
    position: absolute; inset: -12px;
    border-radius: 50%;
    border: 2px solid rgba(124,92,255,0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 0.2; }
  }
  .spin-hint {
    margin-top: 20px;
    font-size: 14px; color: var(--text3); font-weight: 700;
  }

  /* Section title */
  .section-title {
    font-size: 12px; color: var(--text3);
    text-transform: uppercase; letter-spacing: 1.5px;
    font-weight: 900; margin-bottom: 12px;
  }

  /* Wheel */
  .wheel-wrap {
    position: relative;
    width: 280px; height: 280px;
    margin: 20px auto 30px;
  }
  .wheel-canvas {
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(124,92,255,0.4), 0 0 100px rgba(124,92,255,0.2);
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.3, 1);
  }
  .wheel-pointer {
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    animation: cardIn .4s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: none; }
  }
  .question-level {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: rgba(255,201,60,0.12);
    border: 1px solid rgba(255,201,60,0.3);
    border-radius: 100px;
    font-size: 12px; font-weight: 900;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 19px; font-weight: 800;
    line-height: 1.35; letter-spacing: -0.3px;
    margin-bottom: 20px;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    padding: 16px 18px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 15px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all .2s;
    display: flex; align-items: center; gap: 12px;
  }
  .answer:active { transform: scale(0.98); }
  .answer .letter {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(124,92,255,0.2);
    color: var(--accent);
    font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .answer.correct {
    background: rgba(46,230,142,0.15);
    border-color: var(--success);
    color: var(--success);
  }
  .answer.correct .letter { background: rgba(46,230,142,0.3); color: var(--success); }
  .answer.wrong {
    background: rgba(255,77,109,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }
  .answer.wrong .letter { background: rgba(255,77,109,0.3); color: var(--danger); }

  /* Result */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    animation: cardIn .4s ease;
  }
  .result-icon { font-size: 64px; margin-bottom: 12px; }
  .result-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
  .result-title.win { color: var(--success); }
  .result-title.lose { color: var(--danger); }
  .result-sub { font-size: 14px; color: var(--text2); margin-bottom: 20px; font-weight: 600; }
  .result-points {
    display: inline-block;
    font-size: 36px; font-weight: 900;
    color: var(--gold);
    padding: 8px 20px;
    background: rgba(255,201,60,0.12);
    border: 1px solid rgba(255,201,60,0.3);
    border-radius: 14px;
    margin-bottom: 22px;
    letter-spacing: -1px;
  }

  /* Buttons */
  .btn {
    padding: 15px 24px;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 900;
    font-family: inherit; cursor: pointer;
    transition: transform .15s, opacity .2s;
    letter-spacing: -0.2px;
    color: #fff;
    width: 100%;
    margin-bottom: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #7c5cff, #ff5c9d);
    box-shadow: 0 10px 28px rgba(124,92,255,0.4);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Shop */
  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .gift-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .gift-card:active { transform: scale(0.97); }
  .gift-card.affordable {
    border-color: rgba(46,230,142,0.4);
    background: linear-gradient(135deg, rgba(46,230,142,0.08), rgba(46,230,142,0.02));
  }
  .gift-emoji { font-size: 44px; margin-bottom: 8px; display: block; }
  .gift-name { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
  .gift-price {
    font-size: 14px; font-weight: 900;
    color: var(--gold);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .gift-price.locked { color: var(--text3); }

  /* History */
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .history-emoji { font-size: 28px; }
  .history-info { flex: 1; min-width: 0; }
  .history-name { font-size: 14px; font-weight: 800; }
  .history-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .history-price {
    font-size: 14px; font-weight: 900;
    color: var(--gold);
  }
  .history-status {
    font-size: 10px; padding: 3px 8px; border-radius: 100px;
    text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px;
    margin-top: 4px;
    display: inline-block;
  }
  .history-status.pending { background: rgba(255,201,60,0.2); color: var(--gold); }
  .history-status.fulfilled { background: rgba(46,230,142,0.2); color: var(--success); }

  /* Empty */
  .empty {
    text-align: center; padding: 50px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 60px; margin-bottom: 14px; opacity: 0.5; }
  .empty-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; line-height: 1.5; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 30px;
    padding: 14px 22px;
    border-radius: 14px;
    background: #1a1f33;
    color: #fff; font-size: 14px; font-weight: 800;
    z-index: 9999; max-width: 88%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.12);
    opacity: 0; transform: translate(-50%, 20px);
    transition: opacity .25s, transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    visibility: hidden;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); visibility: visible; }
  .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
  .toast.error { background: linear-gradient(135deg, #ef4444, #b91c1c); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    z-index: 500;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: #131624;
    border-radius: 20px;
    padding: 24px;
    max-width: 340px; width: 100%;
    text-align: center;
    border: 1px solid var(--border);
    animation: popIn .35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-emoji { font-size: 56px; margin-bottom: 12px; }
  .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
  .modal-text { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="logo-dot"></span>Квиз-Рулетка</div>
</div>

<div class="main">

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-left">
      <div class="balance-icon">💰</div>
      <div>
        <div class="balance-label">Баланс</div>
        <div class="balance-value"><span class="star">⭐</span> <span id="balance">0</span></div>
      </div>
    </div>
  </div>

  <!-- Energy -->
  <div class="energy-card">
    <div class="energy-top">
      <span class="label">⚡ Энергия</span>
      <span class="val"><span id="energy">0</span> / <span id="maxEnergy">10</span></span>
    </div>
    <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="play">🎰 Играть</div>
    <div class="tab" data-tab="shop">🛍 Магазин</div>
    <div class="tab" data-tab="history">📜 История</div>
  </div>

  <!-- PLAY -->
  <div id="view-play">
    <!-- Spin screen -->
    <div id="screen-spin">
      <div class="wheel-wrap">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" class="wheel-canvas" width="280" height="280"></canvas>
      </div>
      <div class="spin-wrap">
        <button class="spin-btn" id="spinBtn" onclick="spin()">🎰</button>
        <div class="spin-hint" id="spinHint">Крути рулетку!</div>
      </div>
    </div>

    <!-- Question screen -->
    <div id="screen-question" class="hidden">
      <div class="question-card">
        <div class="question-level" id="questionLevel">🎯 10 баллов</div>
        <div class="question-text" id="questionText">Загрузка...</div>
        <div class="answers" id="answers"></div>
      </div>
    </div>

    <!-- Result screen -->
    <div id="screen-result" class="hidden">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">🎉</div>
        <div class="result-title" id="resultTitle">Правильно!</div>
        <div class="result-sub" id="resultSub">Ты угадал</div>
        <div class="result-points" id="resultPoints">+10 ⭐</div>
        <button class="btn btn-primary" onclick="backToSpin()">🎰 Крутить ещё</button>
      </div>
    </div>
  </div>

  <!-- SHOP -->
  <div id="view-shop" class="hidden">
    <div class="section-title">Обменять баллы на подарки</div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <!-- HISTORY -->
  <div id="view-history" class="hidden">
    <div class="section-title">Мои подарки</div>
    <div id="historyList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-emoji" id="modalEmoji">🎁</div>
    <div class="modal-title" id="modalTitle">Успех!</div>
    <div class="modal-text" id="modalText"></div>
    <button class="btn btn-primary" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
// ==========================================================
// CONFIG
// ==========================================================
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';

var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#0b0d17'); } catch(e) {}
try { tg.setBackgroundColor('#0b0d17'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };

// ==========================================================
// STATE
// ==========================================================
var state = {
  balance: 0,
  energy: 10,
  maxEnergy: 10,
  gifts: [],
  currentSpin: null,
  spinning: false,
  wheelAngle: 0,
};

// ==========================================================
// API
// ==========================================================
function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('Bad JSON')); }
        } else {
          try {
            var err = JSON.parse(xhr.responseText);
            reject(err);
          } catch(e) { reject(new Error('HTTP ' + xhr.status)); }
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}
function apiGet(p) { return apiRequest('GET', p); }
function apiPost(p, b) { return apiRequest('POST', p, b); }

// ==========================================================
// LOAD PROFILE
// ==========================================================
function loadProfile() {
  if (!user.id) return;
  apiGet('/api/quiz/profile/' + user.id).then(function(data) {
    state.balance = data.balance || 0;
    state.energy = data.energy || 0;
    state.maxEnergy = data.maxEnergy || 10;
    renderProfile();
  }).catch(function(e) { console.error(e); });
}

function renderProfile() {
  document.getElementById('balance').textContent = state.balance;
  document.getElementById('energy').textContent = state.energy;
  document.getElementById('maxEnergy').textContent = state.maxEnergy;
  var pct = (state.energy / state.maxEnergy) * 100;
  document.getElementById('energyFill').style.width = pct + '%';
  updateShopAffordability();
}

// ==========================================================
// WHEEL
// ==========================================================
var SEGMENTS = [
  { points: 10, color: '#2ee68e', text: '10' },
  { points: 20, color: '#60a5fa', text: '20' },
  { points: 30, color: '#a78bfa', text: '30' },
  { points: 50, color: '#f59e0b', text: '50' },
  { points: 100, color: '#ef4444', text: '100' },
  { points: 250, color: '#ffc93c', text: '250' },
];

function drawWheel() {
  var c = document.getElementById('wheelCanvas');
  var ctx = c.getContext('2d');
  var cx = 140, cy = 140, r = 130;
  var seg = (Math.PI * 2) / SEGMENTS.length;

  ctx.clearRect(0, 0, 280, 280);

  for (var i = 0; i < SEGMENTS.length; i++) {
    var startAngle = i * seg - Math.PI / 2;
    var endAngle = startAngle + seg;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = SEGMENTS[i].color;
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Текст
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + seg / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 4;
    ctx.fillText(SEGMENTS[i].text, r - 18, 8);
    ctx.restore();
  }

  // Центральный круг
  ctx.beginPath();
  ctx.arc(cx, cy, 32, 0, Math.PI * 2);
  ctx.fillStyle = '#0b0d17';
  ctx.fill();
  ctx.strokeStyle = '#7c5cff';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function spinWheelTo(index) {
  var seg = 360 / SEGMENTS.length;
  // Хотим чтобы указатель (сверху) попал на нужный сегмент
  // Сегмент 0 начинается с угла -90° (вверх)
  var targetAngle = 360 * 5 + (360 - index * seg - seg / 2);
  state.wheelAngle = targetAngle;
  var canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = 'rotate(' + targetAngle + 'deg)';
}

// ==========================================================
// SPIN
// ==========================================================
function spin() {
  if (state.spinning) return;
  if (state.energy < 1) {
    showToast('⚡ Нет энергии. Восстановится через 5 мин', 'error');
    return;
  }

  state.spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinHint').textContent = 'Крутим...';

  apiPost('/api/quiz/spin', { userId: user.id }).then(function(data) {
    // Определяем индекс сегмента по выпавшему уровню
    var idx = SEGMENTS.findIndex(function(s) { return s.points === data.level; });
    if (idx === -1) idx = 0;

    // Крутим визуально
    spinWheelTo(idx);

    state.energy = data.energy;
    state.currentSpin = data;
    renderProfile();

    setTimeout(function() {
      showQuestion(data);
    }, 4200);
  }).catch(function(err) {
    state.spinning = false;
    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinHint').textContent = 'Крути рулетку!';
    showToast(err.error || 'Ошибка', 'error');
  });
}

// ==========================================================
// QUESTION
// ==========================================================
function showQuestion(data) {
  document.getElementById('screen-spin').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-question').classList.remove('hidden');

  document.getElementById('questionLevel').textContent = '🎯 ' + data.level + ' баллов';
  document.getElementById('questionText').textContent = data.question;

  var letters = ['A', 'B', 'C', 'D'];
  var html = '';
  for (var i = 0; i < data.answers.length; i++) {
    html += '<button class="answer" onclick="answer(' + i + ')">' +
      '<span class="letter">' + letters[i] + '</span>' +
      '<span>' + escapeHtml(data.answers[i]) + '</span>' +
      '</button>';
  }
  document.getElementById('answers').innerHTML = html;
  state.answered = false;
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;

  var btns = document.querySelectorAll('.answer');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });

  apiPost('/api/quiz/answer', {
    userId: user.id,
    token: state.currentSpin.token,
    answer: idx,
  }).then(function(res) {
    // Подсветка
    if (btns[res.correctAnswer]) btns[res.correctAnswer].classList.add('correct');
    if (!res.correct && btns[idx]) btns[idx].classList.add('wrong');

    state.balance = res.balance;
    state.energy = state.energy;
    renderProfile();

    setTimeout(function() {
      showResult(res);
    }, 1200);
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
    backToSpin();
  });
}

function showResult(res) {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  if (res.correct) {
    document.getElementById('resultIcon').textContent = '🎉';
    document.getElementById('resultTitle').textContent = 'Правильно!';
    document.getElementById('resultTitle').className = 'result-title win';
    document.getElementById('resultSub').textContent = 'Отличный ответ!';
    document.getElementById('resultPoints').textContent = '+' + res.points + ' ⭐';
    document.getElementById('resultPoints').style.display = 'inline-block';
    playSound('win');
  } else {
    document.getElementById('resultIcon').textContent = '😢';
    document.getElementById('resultTitle').textContent = 'Ошибка';
    document.getElementById('resultTitle').className = 'result-title lose';
    document.getElementById('resultSub').textContent = 'Не в этот раз';
    document.getElementById('resultPoints').textContent = '+0 ⭐';
    document.getElementById('resultPoints').style.color = 'var(--text3)';
    playSound('error');
  }
}

function backToSpin() {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-spin').classList.remove('hidden');
  document.getElementById('spinBtn').disabled = false;
  document.getElementById('spinHint').textContent = 'Крути рулетку!';
  document.getElementById('resultPoints').style.color = '';
  document.getElementById('resultPoints').style.display = '';
  state.spinning = false;
  state.answered = false;
  loadProfile();
}

// ==========================================================
// SHOP
// ==========================================================
function loadGifts() {
  apiGet('/api/quiz/gifts').then(function(gifts) {
    state.gifts = gifts;
    renderShop();
  }).catch(function(e) { console.error(e); });
}

function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = '';
  for (var i = 0; i < state.gifts.length; i++) {
    var g = state.gifts[i];
    var affordable = state.balance >= g.price;
    html += '<div class="gift-card ' + (affordable ? 'affordable' : '') + '" onclick="buyGift(\'' + g.id + '\')">' +
      '<span class="gift-emoji">' + g.emoji + '</span>' +
      '<div class="gift-name">' + escapeHtml(g.name) + '</div>' +
      '<div class="gift-price ' + (affordable ? '' : 'locked') + '">⭐ ' + g.price + '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
}

function updateShopAffordability() {
  var cards = document.querySelectorAll('.gift-card');
  for (var i = 0; i < cards.length; i++) {
    var priceEl = cards[i].querySelector('.gift-price');
    var price = parseInt(priceEl.textContent.replace(/\D/g, ''));
    if (state.balance >= price) {
      cards[i].classList.add('affordable');
      priceEl.classList.remove('locked');
    } else {
      cards[i].classList.remove('affordable');
      priceEl.classList.add('locked');
    }
  }
}

function buyGift(giftId) {
  var gift = state.gifts.find(function(g) { return g.id === giftId; });
  if (!gift) return;
  if (state.balance < gift.price) {
    showToast('Недостаточно баллов', 'error');
    return;
  }

  if (!confirm('Обменять ' + gift.price + ' баллов на ' + gift.emoji + ' ' + gift.name + '?')) return;

  apiPost('/api/quiz/exchange', {
    userId: user.id,
    giftId: giftId,
    firstName: user.first_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) {
      showToast(res.error, 'error');
      return;
    }
    state.balance = res.balance;
    renderProfile();
    showModal(gift.emoji, 'Заявка отправлена!', 'Админ подарит тебе подарок в Telegram в течение дня. Он придёт тебе в чат с ботом 🎁');
    loadProfile();
    loadHistory();
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
  });
}

// ==========================================================
// HISTORY
// ==========================================================
function loadHistory() {
  apiGet('/api/quiz/exchanges/' + user.id).then(function(list) {
    var el = document.getElementById('historyList');
    if (!list || list.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📜</div><div class="empty-title">Пока пусто</div><div class="empty-sub">Купи подарки в магазине</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var statusText = e.status === 'fulfilled' ? 'Подарено' : 'В обработке';
      html += '<div class="history-item">' +
        '<div class="history-emoji">' + e.giftEmoji + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + escapeHtml(e.giftName) + '</div>' +
          '<div class="history-date">' + formatDate(e.date) + '</div>' +
          '<span class="history-status ' + e.status + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="history-price">⭐ ' + e.price + '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  }).catch(function(e) { console.error(e); });
}

// ==========================================================
// UI HELPERS
// ==========================================================
function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

function showModal(emoji, title, text) {
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// ==========================================================
// SOUND
// ==========================================================
var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = now + i * 0.1;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.35);
    });
  } else if (type === 'error') {
    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(100, now + 0.2);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.25);
  } else if (type === 'spin') {
    // Накрутка
    for (var i = 0; i < 12; i++) {
      var o2 = audioCtx.createOscillator(); var g2 = audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.value = 800 + i * 30;
      var t2 = now + i * 0.05;
      g2.gain.setValueAtTime(0.05, t2);
      g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.08);
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start(t2); o2.stop(t2 + 0.08);
    }
  }
}

// ==========================================================
// TABS
// ==========================================================
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    var tab = t.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x === t); });
    document.getElementById('view-play').classList.toggle('hidden', tab !== 'play');
    document.getElementById('view-shop').classList.toggle('hidden', tab !== 'shop');
    document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
    if (tab === 'shop') renderShop();
    if (tab === 'history') loadHistory();
  });
});

// ==========================================================
// AUTO REFRESH ENERGY
// ==========================================================
setInterval(loadProfile, 60000);

// ==========================================================
// INIT
// ==========================================================
drawWheel();
loadProfile();
loadGifts();
loadHistory();
</script>
