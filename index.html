<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Квиз-Рулетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg: #05040d;
    --bg2: #0a0718;
    --violet: #a855f7;
    --violet-bright: #c084fc;
    --pink: #ec4899;
    --cyan: #22d3ee;
    --gold: #fbbf24;
    --gold-bright: #fde047;
    --green: #10b981;
    --red: #ef4444;
    --text: #ffffff;
    --text2: rgba(255,255,255,0.65);
    --text3: rgba(255,255,255,0.35);
  }

  html, body {
    overscroll-behavior-y: none;
    width: 100%;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 30px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    font-weight: 500;
  }

  /* ==== Aurora background ==== */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    filter: blur(80px);
    opacity: 0.6;
  }
  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: auroraMove 20s ease-in-out infinite;
  }
  .a1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #a855f7 0%, transparent 70%);
    top: -100px; left: -100px;
    animation-delay: 0s;
  }
  .a2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #ec4899 0%, transparent 70%);
    top: 30%; right: -150px;
    animation-delay: -5s;
  }
  .a3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
    bottom: -100px; left: 30%;
    animation-delay: -10s;
    opacity: 0.5;
  }
  .a4 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #fbbf24 0%, transparent 70%);
    top: 50%; left: 20%;
    animation-delay: -15s;
    opacity: 0.3;
  }
  @keyframes auroraMove {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(60px, -40px) scale(1.15); }
    50% { transform: translate(-40px, 60px) scale(0.9); }
    75% { transform: translate(-60px, -30px) scale(1.1); }
  }

  /* ==== Star field ==== */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
    box-shadow: 0 0 4px rgba(255,255,255,0.8);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* ==== Topbar ==== */
  .topbar {
    position: sticky;
    top: 0;
    padding: 16px 18px;
    padding-top: max(16px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    background: rgba(5,4,13,0.65);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgba(168,85,247,0.15);
  }
  .logo {
    font-size: 17px; font-weight: 900;
    letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #c084fc 0%, #ec4899 50%, #fbbf24 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: logoShine 4s ease-in-out infinite;
  }
  @keyframes logoShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .logo-icon {
    font-size: 22px;
    filter: drop-shadow(0 0 8px rgba(192,132,252,0.8));
    animation: logoSpin 6s ease-in-out infinite;
  }
  @keyframes logoSpin {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(15deg); }
  }

  .main {
    position: relative;
    z-index: 2;
    padding: 16px;
  }

  /* ==== Stats ==== */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-box {
    border-radius: 20px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform .3s;
  }
  .stat-box::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .stat-box.balance {
    background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(236,72,153,0.15));
    box-shadow: 0 8px 30px rgba(168,85,247,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .stat-box.energy {
    background: linear-gradient(135deg, rgba(251,191,36,0.22), rgba(245,158,11,0.12));
    box-shadow: 0 8px 30px rgba(251,191,36,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 900;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 5px;
    position: relative;
    z-index: 1;
  }
  .stat-box.balance .stat-label { color: rgba(192,132,252,0.9); }
  .stat-box.energy .stat-label { color: rgba(251,191,36,0.9); }
  .stat-value {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1.2px;
    line-height: 1;
    display: flex; align-items: baseline; gap: 4px;
    position: relative;
    z-index: 1;
  }
  .stat-box.balance .stat-value {
    background: linear-gradient(135deg, #fbbf24 0%, #fde047 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(251,191,36,0.5));
  }
  .stat-box.energy .stat-value { color: #fbbf24; }
  .stat-value small {
    font-size: 13px;
    font-weight: 700;
    color: var(--text3);
    -webkit-text-fill-color: var(--text3);
  }
  .energy-bar-mini {
    height: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 5px;
    margin-top: 10px;
    overflow: hidden;
    position: relative;
    z-index: 1;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }
  .energy-bar-mini-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 5px;
    transition: width .5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(251,191,36,0.9), 0 0 4px rgba(251,191,36,1);
    position: relative;
  }
  .energy-bar-mini-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: barShine 2s ease-in-out infinite;
  }
  @keyframes barShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ==== Tabs ==== */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    padding: 5px;
    border-radius: 18px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text3);
    cursor: pointer;
    transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
  }
  .tab.active {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 8px 24px rgba(168,85,247,0.5),
      0 0 0 1px rgba(255,255,255,0.15),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transform: scale(1.02);
  }
  .tab.active::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: tabShine 2s ease-in-out infinite;
  }
  @keyframes tabShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ==== WHEEL ==== */
  .wheel-container {
    display: flex;
    justify-content: center;
    padding: 24px 0 16px;
    position: relative;
  }
  .wheel-wrap {
    position: relative;
    width: min(320px, 84vw);
    aspect-ratio: 1;
    animation: wheelFloat 4s ease-in-out infinite;
  }
  @keyframes wheelFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Outer glow rings */
  .wheel-glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #a855f7 0%, #ec4899 25%, #fbbf24 50%, #22d3ee 75%, #a855f7 100%);
    animation: rotateGlow 6s linear infinite;
    filter: blur(18px);
    opacity: 0.65;
  }
  @keyframes rotateGlow {
    to { transform: rotate(360deg); }
  }

  .wheel-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(255,255,255,0.15) 0deg,
      rgba(255,255,255,0.4) 30deg,
      rgba(255,255,255,0.15) 60deg,
      rgba(255,255,255,0.15) 360deg);
    animation: rotateGlow 3s linear infinite reverse;
    padding: 3px;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  .wheel-inner-bg {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #0f0a20, #05040d);
    box-shadow:
      inset 0 0 60px rgba(168,85,247,0.3),
      inset 0 0 20px rgba(0,0,0,0.8);
    z-index: 1;
  }

  #wheelCanvas {
    position: absolute;
    inset: 10px;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    border-radius: 50%;
    z-index: 2;
    transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.35, 1);
    will-change: transform;
    filter: drop-shadow(0 0 20px rgba(168,85,247,0.4));
  }

  /* Pointer */
  .wheel-pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    filter: drop-shadow(0 6px 20px rgba(251,191,36,0.9));
    animation: pointerBob 1.2s ease-in-out infinite;
  }
  @keyframes pointerBob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }
  .pointer-inner {
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 28px solid #fbbf24;
    position: relative;
  }
  .pointer-inner::before {
    content: '';
    position: absolute;
    top: -12px;
    left: -12px;
    width: 24px;
    height: 24px;
    background: radial-gradient(circle, #fde047 0%, #fbbf24 40%, transparent 70%);
    border-radius: 50%;
    filter: blur(4px);
    animation: pointerPulse 1s ease-in-out infinite;
  }
  @keyframes pointerPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.6); opacity: 0.3; }
  }

  /* Center spin button */
  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #c084fc 0%, #a855f7 40%, #7c3aed 70%, #5b21b6 100%);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    cursor: pointer;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    overflow: hidden;
    transition: transform .15s, box-shadow .3s;
    box-shadow:
      0 10px 40px rgba(168,85,247,0.7),
      0 0 0 8px rgba(168,85,247,0.15),
      inset 0 -6px 16px rgba(0,0,0,0.4),
      inset 0 4px 12px rgba(255,255,255,0.4);
    animation: btnPulse 2s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% {
      box-shadow:
        0 10px 40px rgba(168,85,247,0.7),
        0 0 0 8px rgba(168,85,247,0.15),
        inset 0 -6px 16px rgba(0,0,0,0.4),
        inset 0 4px 12px rgba(255,255,255,0.4);
    }
    50% {
      box-shadow:
        0 14px 50px rgba(168,85,247,0.95),
        0 0 0 14px rgba(168,85,247,0.08),
        inset 0 -6px 16px rgba(0,0,0,0.4),
        inset 0 4px 12px rgba(255,255,255,0.4);
    }
  }
  .spin-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(255,255,255,0.5) 30deg,
      transparent 60deg,
      transparent 360deg);
    animation: btnRotate 3s linear infinite;
    pointer-events: none;
  }
  @keyframes btnRotate {
    to { transform: rotate(360deg); }
  }
  .spin-btn:active:not(:disabled) {
    transform: translate(-50%, -50%) scale(0.9);
  }
  .spin-btn:disabled {
    background: radial-gradient(circle at 35% 30%, #4a4a5a, #2a2a3a 60%, #1a1a2a);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    cursor: not-allowed;
    opacity: 0.7;
    animation: none;
  }
  .spin-btn:disabled::before { display: none; }
  .spin-btn .emoji {
    font-size: clamp(22px, 6.5vw, 30px);
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    position: relative;
    z-index: 1;
  }
  .spin-btn .txt {
    font-size: clamp(8px, 2.3vw, 11px);
    opacity: 0.95;
    position: relative;
    z-index: 1;
  }

  .spin-info {
    text-align: center;
    font-size: 13px;
    color: var(--text2);
    font-weight: 700;
    margin-top: 18px;
    letter-spacing: -0.1px;
    transition: color .3s;
  }
  .spin-info.warn { color: var(--gold); }
  .spin-info.err { color: var(--red); }

  /* ==== Cards (glass) ==== */
  .glass-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 24px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    animation: cardIn .45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: none; }
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%);
    pointer-events: none;
    filter: blur(40px);
  }

  .question-level {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(245,158,11,0.1));
    border: 1px solid rgba(251,191,36,0.5);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 900;
    color: var(--gold-bright);
    margin-bottom: 18px;
    position: relative;
    box-shadow: 0 4px 20px rgba(251,191,36,0.25);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .question-level::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 12px var(--gold-bright);
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .question-text {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -0.5px;
    margin-bottom: 22px;
    position: relative;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .answers { display: flex; flex-direction: column; gap: 10px; position: relative; }
  .answer {
    padding: 16px 18px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 14px;
    line-height: 1.35;
    position: relative;
    overflow: hidden;
  }
  .answer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,0.1), transparent);
    transform: translateX(-100%);
    transition: transform .5s;
  }
  .answer:active {
    transform: scale(0.98);
    background: rgba(168,85,247,0.08);
  }
  .answer .letter {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(236,72,153,0.2));
    color: #c084fc;
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .25s;
    border: 1px solid rgba(168,85,247,0.3);
  }
  .answer.correct {
    background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.08));
    border-color: var(--green);
    color: #6ee7b7;
    box-shadow: 0 0 30px rgba(16,185,129,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: correctPop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  .answer.correct .letter {
    background: linear-gradient(135deg, rgba(16,185,129,0.5), rgba(16,185,129,0.3));
    color: #fff;
    border-color: var(--green);
    box-shadow: 0 0 16px rgba(16,185,129,0.7);
  }
  .answer.wrong {
    background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.08));
    border-color: var(--red);
    color: #fca5a5;
    animation: wrongShake .4s;
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .answer.wrong .letter {
    background: linear-gradient(135deg, rgba(239,68,68,0.5), rgba(239,68,68,0.3));
    color: #fff;
    border-color: var(--red);
  }

  /* ==== Result ==== */
  .result-card {
    text-align: center;
    padding: 40px 24px 32px;
    position: relative;
    overflow: hidden;
  }
  .result-card.win::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(251,191,36,0.25), transparent 60%);
    pointer-events: none;
  }
  .result-card.lose::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(239,68,68,0.2), transparent 60%);
    pointer-events: none;
  }
  .result-icon {
    font-size: 88px;
    line-height: 1;
    margin-bottom: 16px;
    position: relative;
    display: inline-block;
    animation: resultBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 8px 24px rgba(251,191,36,0.6));
  }
  @keyframes resultBounce {
    0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }

  .gift-card {

  .gift-card:nth-child(1) { animation-delay: 0.05s; }

  .gift-card.affordable {

  .gift-card.affordable::after {

  .toast.show {

  .modal-box {

  .modal-box::before {

  @keyframes popIn {

  .modal-emoji {
    font-size: 72px;

    display: inline-block;

  .modal-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 10px;

  .modal-text {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.55;

    font-weight: 500;

  /* ==== Confetti ==== */
  .confetti {
    position: fixed;
    inset: 0;

    z-index: 9998;
    overflow: hidden;
  }
  .confetti-piece {

    }

      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }

  .hidden { display: none !important; }
</style>
</head>

<script>
// ==========================================================
// CONFIG
// ==========================================================
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';

var tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch(e) {}
try { tg.setHeaderColor('#05040d'); } catch(e) {}
try { tg.setBackgroundColor('#05040d'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };

function haptic(type) {
  try {
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch(e) {}
}

// ==========================================================
// STATE
// ==========================================================
var state = {
  balance: 0,
  energy: 10,
  maxEnergy: 10,
  gifts: [],
  currentSpin: null,
  spinning: false,
  wheelRotation: 0,
  answered: false,
};

var SEGMENTS = [
  { points: 10,  color: '#10b981', color2: '#6ee7b7', text: '10',  emoji: '🍀' },
  { points: 20,  color: '#3b82f6', color2: '#93c5fd', text: '20',  emoji: '💧' },
  { points: 30,  color: '#a855f7', color2: '#d8b4fe', text: '30',  emoji: '🔮' },
  { points: 50,  color: '#f59e0b', color2: '#fcd34d', text: '50',  emoji: '🔥' },
  { points: 100, color: '#ef4444', color2: '#fca5a5', text: '100', emoji: '💎' },
  { points: 250, color: '#fbbf24', color2: '#fde047', text: '250', emoji: '👑' },
];

// ==========================================================
// STARS
// ==========================================================
function initStars() {
  var c = document.getElementById('stars');
  var html = '';
  for (var i = 0; i < 60; i++) {
    var size = Math.random() * 2 + 1;
    var x = Math.random() * 100;
    var y = Math.random() * 100;
    var delay = Math.random() * 4;
    var dur = 2 + Math.random() * 3;
    html += '<div class="star" style="left:' + x + '%;top:' + y + '%;width:' + size + 'px;height:' + size + 'px;animation-delay:' + delay + 's;animation-duration:' + dur + 's;"></div>';
  }
  c.innerHTML = html;
}

// ==========================================================
// API
// ==========================================================
function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('Bad JSON')); }
        } else {
          try { reject(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('HTTP ' + xhr.status)); }
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}
function apiGet(p) { return apiRequest('GET', p); }
function apiPost(p, b) { return apiRequest('POST', p, b); }

// ==========================================================
// WHEEL DRAWING
// ==========================================================
function drawWheel() {
  var c = document.getElementById('wheelCanvas');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var cx = W / 2, cy = H / 2;
  var r = Math.min(W, H) / 2 - 10;
  var seg = (Math.PI * 2) / SEGMENTS.length;

  ctx.clearRect(0, 0, W, H);

  // shadow on the whole canvas
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 10;

  for (var i = 0; i < SEGMENTS.length; i++) {
    var startAngle = i * seg - Math.PI / 2;
    var endAngle = startAngle + seg;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();

    // Radial gradient from center
    var grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
    grad.addColorStop(0, SEGMENTS[i].color2);
    grad.addColorStop(0.6, SEGMENTS[i].color);
    grad.addColorStop(1, SEGMENTS[i].color);

    ctx.fillStyle = grad;
    ctx.fill();

    // Inner border
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Reset shadow for text
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // big points number
    ctx.fillStyle = '#fff';
    ctx.font = '900 62px -apple-system, "SF Pro Display", Inter, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillText(SEGMENTS[i].text, r - 36, -8);

    // emoji below
    ctx.font = '400 40px sans-serif';
    ctx.shadowBlur = 6;
    ctx.fillText(SEGMENTS[i].emoji, r - 36, 44);

    // little star
    ctx.font = '700 20px sans-serif';
    ctx.shadowBlur = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('⭐', r - 36, 90);

    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Inner decorative circle behind button
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(5,4,13,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(168,85,247,0.6)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Bulbs around the ring
  for (var k = 0; k < 24; k++) {
    var ang = (k / 24) * Math.PI * 2 - Math.PI / 2;
    var bx = cx + Math.cos(ang) * (r - 4);
    var by = cy + Math.sin(ang) * (r - 4);
    ctx.beginPath();
    ctx.arc(bx, by, 3, 0, Math.PI * 2);
    var isLit = k % 2 === 0;
    ctx.fillStyle = isLit ? '#fde047' : 'rgba(255,255,255,0.3)';
    ctx.shadowColor = isLit ? '#fde047' : 'transparent';
    ctx.shadowBlur = isLit ? 12 : 0;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ==========================================================
// SPIN LOGIC
// ==========================================================
function spinWheelTo(segmentIndex) {
  var seg = 360 / SEGMENTS.length;
  var currentMod = ((state.wheelRotation % 360) + 360) % 360;
  var targetMod = ((330 - segmentIndex * seg) % 360 + 360) % 360;
  var delta = ((targetMod - currentMod) % 360 + 360) % 360;

  state.wheelRotation += 360 * 5 + delta;

  var canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = 'rotate(' + state.wheelRotation + 'deg)';
}

// ==========================================================
// PROFILE
// ==========================================================
function loadProfile() {
  if (!user.id) return;
  apiGet('/api/quiz/profile/' + user.id).then(function(data) {
    state.balance = data.balance || 0;
    state.energy = data.energy || 0;
    state.maxEnergy = data.maxEnergy || 10;
    renderProfile();
  }).catch(function(e) { console.error(e); });
}

function animateCounter(el, from, to) {
  if (from === to) return;
  var duration = 600;
  var start = performance.now();
  function step(now) {
    var t = Math.min(1, (now - start) / duration);
    t = 1 - Math.pow(1 - t, 3);
    var val = Math.round(from + (to - from) * t);
    el.textContent = val;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

var prevBalance = 0;
function renderProfile() {
  var balEl = document.getElementById('balance');
  animateCounter(balEl, prevBalance, state.balance);
  prevBalance = state.balance;

  document.getElementById('energy').textContent = state.energy;
  document.getElementById('maxEnergy').textContent = state.maxEnergy;
  var pct = (state.energy / state.maxEnergy) * 100;
  document.getElementById('energyFill').style.width = pct + '%';
  updateShopAffordability();
  updateSpinBtn();
}

function updateSpinBtn() {
  var btn = document.getElementById('spinBtn');
  var info = document.getElementById('spinInfo');

  if (state.spinning) {
    btn.disabled = true;
    info.textContent = '🎰 Крутим...';
    info.className = 'spin-info';
    return;
  }
  if (state.energy < 1) {
    btn.disabled = true;
    info.textContent = '⚡ Нет энергии. Восстановится через 5 мин';
    info.className = 'spin-info warn';
    return;
  }
  btn.disabled = false;
  info.textContent = 'Нажми на кнопку в центре колеса';
  info.className = 'spin-info';
}

// ==========================================================
// SPIN
// ==========================================================
function spin() {
  if (state.spinning) return;
  if (state.energy < 1) {
    showToast('⚡ Нет энергии', 'error');
    haptic('error');
    return;
  }

  state.spinning = true;
  updateSpinBtn();
  haptic('medium');

  apiPost('/api/quiz/spin', { userId: user.id }).then(function(data) {
    var idx = SEGMENTS.findIndex(function(s) { return s.points === data.level; });
    if (idx === -1) idx = 0;

    spinWheelTo(idx);
    state.energy = data.energy;
    state.currentSpin = data;
    renderProfile();

    setTimeout(function() { showQuestion(data); }, 4700);
  }).catch(function(err) {
    state.spinning = false;
    updateSpinBtn();
    showToast(err.error || 'Ошибка', 'error');
    haptic('error');
  });
}

// ==========================================================
// QUESTION
// ==========================================================
function showQuestion(data) {
  document.getElementById('screen-spin').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-question').classList.remove('hidden');

  document.getElementById('questionLevel').textContent = data.level + ' баллов';
  document.getElementById('questionText').textContent = data.question;

  var letters = ['A', 'B', 'C', 'D'];
  var html = '';
  for (var i = 0; i < data.answers.length; i++) {
    html += '<button class="answer" data-idx="' + i + '">' +
      '<span class="letter">' + letters[i] + '</span>' +
      '<span>' + escapeHtml(data.answers[i]) + '</span>' +
      '</button>';
  }
  document.getElementById('answers').innerHTML = html;
  document.querySelectorAll('.answer').forEach(function(b) {
    b.addEventListener('click', function() { answer(parseInt(b.getAttribute('data-idx'))); });
  });
  state.answered = false;
  haptic('light');
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;

  var btns = document.querySelectorAll('.answer');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });

  apiPost('/api/quiz/answer', {
    userId: user.id,
    token: state.currentSpin.token,
    answer: idx,
  }).then(function(res) {
    if (btns[res.correctAnswer]) btns[res.correctAnswer].classList.add('correct');
    if (!res.correct && btns[idx]) btns[idx].classList.add('wrong');

    state.balance = res.balance;
    renderProfile();

    setTimeout(function() { showResult(res); }, 1400);
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
    backToSpin();
  });
}

function showResult(res) {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  var card = document.getElementById('resultCard');
  if (res.correct) {
    card.className = 'glass-card result-card win';
    document.getElementById('resultIcon').textContent = '🏆';
    document.getElementById('resultTitle').textContent = 'ПРАВИЛЬНО!';
    document.getElementById('resultTitle').className = 'result-title win';
    document.getElementById('resultSub').textContent = 'Отличный ответ!';
    var p = document.getElementById('resultPoints');
    p.textContent = '+' + res.points + ' ⭐';
    p.className = 'result-points';
    playSound('win');
    haptic('success');
    launchConfetti();
  } else {
    card.className = 'glass-card result-card lose';
    document.getElementById('resultIcon').textContent = '💔';
    document.getElementById('resultTitle').textContent = 'ОШИБКА';
    document.getElementById('resultTitle').className = 'result-title lose';
    document.getElementById('resultSub').textContent = 'Не в этот раз';
    var p2 = document.getElementById('resultPoints');
    p2.textContent = '+0 ⭐';
    p2.className = 'result-points zero';
    playSound('error');
    haptic('error');
  }
}

function backToSpin() {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-spin').classList.remove('hidden');
  state.spinning = false;
  state.answered = false;
  updateSpinBtn();
  loadProfile();
}

// ==========================================================
// CONFETTI
// ==========================================================
function launchConfetti() {
  var c = document.getElementById('confetti');
  var colors = ['#a855f7', '#ec4899', '#fbbf24', '#22d3ee', '#10b981', '#f43f5e'];
  for (var i = 0; i < 80; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = '-20px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    c.appendChild(piece);
    setTimeout(function(p) { return function() { p.remove(); }; }(piece), 4000);
  }
}

// ==========================================================
// SHOP
// ==========================================================
function loadGifts() {
  apiGet('/api/quiz/gifts').then(function(gifts) {
    state.gifts = gifts;
    renderShop();
  }).catch(function(e) { console.error(e); });
}

function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = '';
  for (var i = 0; i < state.gifts.length; i++) {
    var g = state.gifts[i];
    var affordable = state.balance >= g.price;
    html += '<div class="gift-card ' + (affordable ? 'affordable' : '') + '" data-gift="' + g.id + '">' +
      '<span class="gift-emoji">' + g.emoji + '</span>' +
      '<div class="gift-name">' + escapeHtml(g.name) + '</div>' +
      '<div class="gift-price">⭐ ' + g.price + '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.gift-card').forEach(function(c) {
    c.addEventListener('click', function() { buyGift(c.getAttribute('data-gift')); });
  });
}

function updateShopAffordability() {
  var cards = document.querySelectorAll('.gift-card');
  for (var i = 0; i < cards.length; i++) {
    var priceEl = cards[i].querySelector('.gift-price');
    if (!priceEl) continue;
    var price = parseInt(priceEl.textContent.replace(/\D/g, ''));
    if (state.balance >= price) cards[i].classList.add('affordable');
    else cards[i].classList.remove('affordable');
  }
}

function buyGift(giftId) {
  var gift = state.gifts.find(function(g) { return g.id === giftId; });
  if (!gift) return;
  if (state.balance < gift.price) {
    showToast('Недостаточно баллов', 'error');
    haptic('error');
    return;
  }

  if (!confirm('Обменять ' + gift.price + ' ⭐ на ' + gift.emoji + ' ' + gift.name + '?')) return;
  haptic('medium');

  apiPost('/api/quiz/exchange', {
    userId: user.id,
    giftId: giftId,
    firstName: user.first_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    state.balance = res.balance;
    renderProfile();
    haptic('success');
    launchConfetti();
    showModal(gift.emoji, 'Заявка отправлена!', 'Админ подарит тебе подарок в Telegram в течение дня. Он придёт в чат с ботом 🎁');
    loadProfile();
    loadHistory();
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
    haptic('error');
  });
}

// ==========================================================
// HISTORY
// ==========================================================
function loadHistory() {
  apiGet('/api/quiz/exchanges/' + user.id).then(function(list) {
    var el = document.getElementById('historyList');
    if (!list || list.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🎁</div><div class="empty-title">Пока пусто</div><div class="empty-sub">Купи подарки в магазине</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var statusText = e.status === 'fulfilled' ? 'Подарено' : 'В обработке';
      html += '<div class="history-item">' +
        '<div class="history-emoji">' + e.giftEmoji + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + escapeHtml(e.giftName) + '</div>' +
          '<div class="history-date">' + formatDate(e.date) + '</div>' +
          '<span class="history-status ' + e.status + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="history-price">⭐ ' + e.price + '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  }).catch(function(e) { console.error(e); });
}

// ==========================================================
// UI HELPERS
// ==========================================================
function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

function showModal(emoji, title, text) {
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// ==========================================================
// SOUND
// ==========================================================
var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach(function(f, i) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = now + i * 0.08;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  } else if (type === 'error') {
    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(220, now);
    o.frequency.exponentialRampToValueAtTime(80, now + 0.25);
    g.gain.setValueAtTime(0.1, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.3);
  }
}

// ==========================================================
// TABS
// ==========================================================
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    var tab = t.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x === t); });
    document.getElementById('view-play').classList.toggle('hidden', tab !== 'play');
    document.getElementById('view-shop').classList.toggle('hidden', tab !== 'shop');
    document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
    haptic('light');
    if (tab === 'shop') renderShop();
    if (tab === 'history') loadHistory();
  });
});

// ==========================================================
// SPIN BUTTON
// ==========================================================
document.getElementById('spinBtn').addEventListener('click', function() {
  initAudio();
  spin();
});

// ==========================================================
// AUTO REFRESH
// ==========================================================
setInterval(loadProfile, 60000);

// ==========================================================
// INIT
// ==========================================================
initStars();
drawWheel();
loadProfile();
loadGifts();
loadHistory();
</script>
