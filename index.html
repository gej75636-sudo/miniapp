<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      min-height: 100vh;
      padding-bottom: 30px;
      transition: background .3s, color .3s;
    }

    /* Шапка с градиентом */
    .header {
      position: relative;
      padding: 40px 20px 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 0 0 30px 30px;
      text-align: center;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -50%; right: -20%;
      width: 300px; height: 300px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -40%; left: -20%;
      width: 250px; height: 250px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    /* Аватарка */
    .avatar-wrap {
      position: relative;
      display: inline-block;
      z-index: 1;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      object-fit: cover;
      background: #ddd;
    }
    .avatar-fallback {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
    }
    .premium-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border-radius: 50%;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(255,140,0,0.4);
    }

    /* Имя и юзернейм */
    .name {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      z-index: 1;
      position: relative;
    }
    .username {
      margin-top: 4px;
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      z-index: 1;
      position: relative;
    }

    /* Карточки со статистикой */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px;
      margin-top: -50px;
      z-index: 2;
      position: relative;
    }
    .stat-card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .stat-label {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #999);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .stat-value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 700;
      color: var(--tg-theme-text-color, #000);
      word-break: break-all;
    }

    /* Основная информация */
    .info-list {
      margin: 20px 16px 0;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--tg-theme-section-separator-color, rgba(0,0,0,0.06));
    }
    .info-item:last-child { border-bottom: none; }
    .info-key {
      font-size: 15px;
      color: var(--tg-theme-hint-color, #999);
    }
    .info-val {
      font-size: 15px;
      font-weight: 600;
      color: var(--tg-theme-text-color, #000);
      text-align: right;
      max-width: 60%;
      word-break: break-all;
    }

    /* Кнопки */
    .actions {
      padding: 20px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .btn-secondary {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
    }

    /* Футер */
    .footer {
      text-align: center;
      padding: 24px 16px 0;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #999);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="avatar-wrap">
      <img id="avatar" class="avatar" style="display:none" alt="Аватар">
      <div id="avatarFallback" class="avatar-fallback">👤</div>
      <div id="premiumBadge" class="premium-badge" style="display:none">⭐</div>
    </div>
    <div id="name" class="name">Загрузка...</div>
    <div id="username" class="username">@...</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Telegram ID</div>
      <div class="stat-value" id="userId">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Язык</div>
      <div class="stat-value" id="langCode">—</div>
    </div>
  </div>

  <div class="info-list">
    <div class="info-item">
      <span class="info-key">Имя</span>
      <span class="info-val" id="firstName">—</span>
    </div>
    <div class="info-item">
      <span class="info-key">Фамилия</span>
      <span class="info-val" id="lastName">—</span>
    </div>
    <div class="info-item">
      <span class="info-key">Премиум</span>
      <span class="info-val" id="premiumText">Нет</span>
    </div>
    <div class="info-item">
      <span class="info-key">Бот</span>
      <span class="info-val" id="isBot">Нет</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="sendToBot()">
      📩 Отправить данные боту
    </button>
    <button class="btn btn-secondary" onclick="tg.close()">
      Закрыть
    </button>
  </div>

  <div class="footer">
    Mini App • <span id="year"></span>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Устанавливаем цвет шапки Telegram под наш градиент
    tg.setHeaderColor('#667eea');
    tg.setBackgroundColor(tg.themeParams.bg_color || '#ffffff');

    const user = tg.initDataUnsafe?.user;

    function fillProfile(u) {
      if (!u) {
        document.getElementById('name').textContent = 'Гость';
        document.getElementById('username').textContent = 'Данные недоступны';
        return;
      }

      // Имя
      const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Без имени';
      document.getElementById('name').textContent = fullName;

      // Юзернейм
      document.getElementById('username').textContent = u.username ? '@' + u.username : '— без юзернейма';

      // ID
      document.getElementById('userId').textContent = u.id;

      // Язык
      document.getElementById('langCode').textContent = (u.language_code || '—').toUpperCase();

      // Имя / фамилия отдельно
      document.getElementById('firstName').textContent = u.first_name || '—';
      document.getElementById('lastName').textContent = u.last_name || '—';

      // Премиум
      if (u.is_premium) {
        document.getElementById('premiumText').textContent = 'Да ✨';
        document.getElementById('premiumBadge').style.display = 'flex';
      } else {
        document.getElementById('premiumText').textContent = 'Нет';
      }

      // Бот
      document.getElementById('isBot').textContent = u.is_bot ? 'Да' : 'Нет';

      // Аватар — Telegram не отдаёт URL аватарки напрямую, поэтому фолбэк:
      // показываем инициалы
      const initials = (u.first_name?.[0] || '') + (u.last_name?.[0] || '');
      const fallback = document.getElementById('avatarFallback');
      if (initials) {
        fallback.textContent = initials.toUpperCase();
      } else {
        fallback.textContent = '👤';
      }
    }

    function sendToBot() {
      const u = tg.initDataUnsafe?.user || {};
      const data = {
        action: 'profile',
        id: u.id,
        first_name: u.first_name,
        last_name: u.last_name,
        username: u.username,
        language_code: u.language_code,
        is_premium: !!u.is_premium,
      };
      tg.sendData(JSON.stringify(data));
      tg.close();
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    fillProfile(user);
  </script>
</body>
</html>
