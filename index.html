<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎁 Розыгрыши</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg: #07070f;
    --card: rgba(26, 26, 46, 0.6);
    --card-solid: #16162a;
    --accent: #a78bfa;
    --accent2: #f093fb;
    --gold: #fbbf24;
    --text: #fff;
    --hint: rgba(255,255,255,0.5);
    --success: #4ade80;
    --danger: #ef4444;
  }

  html, body {
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
    overflow-x: hidden;
    position: relative;
  }

  /* Анимированный фон */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.4;
    animation: float 15s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }
  .g1 { width: 400px; height: 400px; background: #667eea; top: -180px; right: -150px; animation-delay: 0s; }
  .g2 { width: 350px; height: 350px; background: #f093fb; bottom: -150px; left: -150px; animation-delay: 3s; }
  .g3 { width: 300px; height: 300px; background: #fbbf24; top: 40%; right: -100px; opacity: 0.2; animation-delay: 6s; }

  /* Звёзды */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }

  /* Топбар */
  .topbar {
    position: sticky; top: 0;
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    background: rgba(7, 7, 15, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo {
    font-size: 20px; font-weight: 900;
    background: linear-gradient(135deg, #a78bfa 0%, #f093fb 50%, #fbbf24 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmerText 4s ease-in-out infinite;
    letter-spacing: -0.5px;
  }
  @keyframes shimmerText {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .user-badge {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    backdrop-filter: blur(10px);
  }
  .avatar-mini {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(102,126,234,0.5);
  }

  .main { position: relative; z-index: 2; padding: 16px; }

  /* Табы — стильные */
  .tabs {
    display: flex; gap: 6px;
    background: rgba(255,255,255,0.04);
    padding: 5px;
    border-radius: 18px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }
  .tab {
    flex: 1; text-align: center; padding: 11px 8px;
    border-radius: 14px; font-size: 12px; font-weight: 800;
    color: var(--hint); cursor: pointer;
    transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,0.5);
    transform: scale(1.02);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: tabShine 2s ease-in-out infinite;
  }
  @keyframes tabShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Карточка розыгрыша */
  .giveaway {
    background: linear-gradient(135deg, rgba(26,26,46,0.85) 0%, rgba(16,16,32,0.85) 100%);
    border-radius: 24px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.08);
    animation: cardEnter .5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    position: relative;
    backdrop-filter: blur(20px);
    box-shadow:
      0 10px 40px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .giveaway::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(167,139,250,0.08), transparent 40%, transparent 60%, rgba(240,147,251,0.06));
    pointer-events: none;
    z-index: 1;
  }

  .giveaway-photo { width: 100%; height: 190px; object-fit: cover; display: block; position: relative; z-index: 1; }
  .giveaway-photo-placeholder {
    width: 100%; height: 190px;
    background:
      radial-gradient(circle at 30% 30%, rgba(167,139,250,0.4), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(240,147,251,0.3), transparent 60%),
      linear-gradient(135deg, #1a1a2e, #2a1a3e);
    display: flex; align-items: center; justify-content: center;
    font-size: 76px;
    position: relative;
  }
  .giveaway-photo-placeholder::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30z' fill='none' stroke='rgba(255,255,255,0.03)' stroke-width='1'/%3E%3C/svg%3E");
    opacity: 0.5;
  }

  .giveaway-badge {
    position: absolute; top: 14px; right: 14px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(20px);
    padding: 7px 14px; border-radius: 12px;
    font-size: 11px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1px;
    z-index: 2;
    display: flex; align-items: center; gap: 5px;
  }
  .giveaway-badge.active {
    color: #4ade80;
    border: 1px solid rgba(74,222,128,0.4);
    box-shadow: 0 0 20px rgba(74,222,128,0.3);
  }
  .giveaway-badge.active::before {
    content: '';
    width: 6px; height: 6px;
    background: #4ade80;
    border-radius: 50%;
    animation: pulseDot 1.5s ease-in-out infinite;
    box-shadow: 0 0 8px #4ade80;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .giveaway-badge.finished {
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .giveaway-body { padding: 18px; position: relative; z-index: 1; }
  .giveaway-title {
    font-size: 19px; font-weight: 900;
    margin-bottom: 8px; line-height: 1.3;
    background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.3px;
  }
  .giveaway-desc {
    font-size: 13px; color: var(--hint); line-height: 1.5; margin-bottom: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .giveaway-prize {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(245,158,11,0.12));
    border: 1px solid rgba(251,191,36,0.4);
    color: var(--gold);
    padding: 8px 14px; border-radius: 12px;
    font-size: 12px; font-weight: 800;
    margin-bottom: 14px;
    box-shadow: 0 0 20px rgba(251,191,36,0.15);
  }
  .giveaway-meta {
    display: flex; gap: 14px; font-size: 12px;
    color: var(--hint); margin-bottom: 16px; flex-wrap: wrap;
    font-weight: 600;
  }
  .giveaway-meta span { display: flex; align-items: center; gap: 5px; }
  .giveaway-meta span b { color: rgba(255,255,255,0.8); font-weight: 800; }

  .giveaway-footer { display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 13px 18px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 800; cursor: pointer;
    font-family: inherit;
    transition: transform .15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .2s, box-shadow .2s;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    box-shadow: 0 8px 24px rgba(102,126,234,0.5);
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform .5s;
  }
  .btn-primary:hover::before { transform: translateX(100%); }
  .btn-primary.joined {
    background: linear-gradient(135deg, #10b981, #047857);
    box-shadow: 0 8px 24px rgba(16,185,129,0.4);
  }
  .btn-primary:disabled {
    background: rgba(255,255,255,0.08);
    color: var(--hint); box-shadow: none; cursor: not-allowed;
  }
  .btn-small {
    padding: 13px 15px; font-size: 13px;
    background: rgba(255,255,255,0.07); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
  }
  .btn-small:hover { background: rgba(255,255,255,0.12); }
  .btn-small.danger {
    background: rgba(239,68,68,0.15); color: var(--danger);
    border-color: rgba(239,68,68,0.35);
  }
  .btn-small.danger:hover { background: rgba(239,68,68,0.25); }

  /* Победитель */
  .winner-block {
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.08));
    border: 1px solid rgba(251,191,36,0.4);
    border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(251,191,36,0.15);
  }
  .winner-block::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(251,191,36,0.15), transparent);
    animation: winnerShine 3s ease-in-out infinite;
  }
  @keyframes winnerShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .winner-block .icon {
    font-size: 28px;
    filter: drop-shadow(0 0 12px rgba(251,191,36,0.8));
    position: relative; z-index: 1;
  }
  .winner-block .info { flex: 1; position: relative; z-index: 1; }
  .winner-block .label {
    font-size: 10px; color: rgba(251,191,36,0.8);
    text-transform: uppercase; font-weight: 900; letter-spacing: 1px;
  }
  .winner-block .name {
    font-size: 15px; font-weight: 900; color: var(--gold);
    margin-top: 2px;
    text-shadow: 0 0 20px rgba(251,191,36,0.5);
  }

  /* Форма */
  .form-card {
    background: linear-gradient(135deg, rgba(26,26,46,0.85), rgba(16,16,32,0.85));
    border-radius: 24px;
    padding: 22px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .form-title {
    font-size: 20px; font-weight: 900;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #a78bfa, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .field { margin-bottom: 16px; }
  .field-label {
    font-size: 11px; color: var(--hint);
    text-transform: uppercase; letter-spacing: 1px;
    font-weight: 900; margin-bottom: 8px; display: block;
  }
  .input, .textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px; color: var(--text); font-family: inherit;
    outline: none;
    transition: all .2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .input:focus, .textarea:focus {
    border-color: var(--accent);
    background: rgba(167,139,250,0.08);
    box-shadow: 0 0 0 4px rgba(167,139,250,0.15);
  }
  .input::placeholder, .textarea::placeholder { color: rgba(255,255,255,0.3); }
  .textarea { resize: vertical; min-height: 90px; }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }

  .form-btn {
    width: 100%; padding: 17px;
    border: none; border-radius: 16px;
    font-size: 16px; font-weight: 900;
    cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, #a78bfa 0%, #f093fb 100%);
    color: #fff;
    margin-top: 10px;
    box-shadow: 0 10px 30px rgba(167,139,250,0.5);
    transition: transform .15s, box-shadow .2s;
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
  }
  .form-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    animation: btnShine 2.5s ease-in-out infinite;
  }
  @keyframes btnShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .form-btn:active { transform: scale(0.97); }
  .form-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Фото дроп */
  .photo-drop {
    width: 100%; min-height: 150px;
    background: rgba(255,255,255,0.04);
    border: 2px dashed rgba(167,139,250,0.4);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: all .25s;
    position: relative;
    padding: 14px;
  }
  .photo-drop:hover { border-color: var(--accent); background: rgba(167,139,250,0.06); }
  .photo-drop:active { transform: scale(0.98); }
  .photo-preview {
    max-width: 100%;
    max-height: 220px;
    border-radius: 12px;
    display: block;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .photo-remove {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff; border: none;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(239,68,68,0.5);
    z-index: 2;
  }
  .photo-placeholder-icon {
    font-size: 42px; text-align: center; margin-bottom: 8px;
    filter: drop-shadow(0 4px 12px rgba(167,139,250,0.5));
  }
  .photo-placeholder-text { font-size: 13px; color: var(--hint); text-align: center; font-weight: 600; }
  .photo-status { font-size: 12px; color: var(--hint); margin-top: 8px; text-align: center; font-weight: 700; }
  .photo-status.success { color: var(--success); }
  .photo-status.error { color: var(--danger); }

  /* Пусто */
  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--hint);
    animation: cardEnter .5s ease;
  }
  .empty-icon {
    font-size: 80px; margin-bottom: 20px;
    opacity: 0.4;
    animation: floatIcon 4s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }
  .empty-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
  .empty-sub { font-size: 13px; line-height: 1.5; }

  /* Загрузка */
  .loading { text-align: center; padding: 50px; color: var(--hint); font-size: 14px; font-weight: 600; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(167,139,250,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
    box-shadow: 0 0 20px rgba(167,139,250,0.3);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Тост */
  .toast {
    position: fixed;
    bottom: 110px; left: 50%;
    transform: translateX(-50%) translateY(150px);
    background: rgba(20,20,35,0.98);
    backdrop-filter: blur(24px);
    color: #fff;
    padding: 15px 24px;
    border-radius: 16px;
    font-size: 14px; font-weight: 800;
    z-index: 999;
    transition: transform .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 15px 50px rgba(0,0,0,0.7);
    max-width: 90%; text-align: center; pointer-events: none;
    letter-spacing: 0.2px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success {
    border-color: rgba(74,222,128,0.5);
    background: linear-gradient(135deg, rgba(16,185,129,0.98), rgba(4,120,87,0.98));
    box-shadow: 0 15px 50px rgba(16,185,129,0.4);
  }
  .toast.error {
    border-color: rgba(239,68,68,0.5);
    background: linear-gradient(135deg, rgba(239,68,68,0.98), rgba(185,28,28,0.98));
    box-shadow: 0 15px 50px rgba(239,68,68,0.4);
  }

  /* Админ FAB */
  .admin-fab {
    position: fixed;
    bottom: 26px; right: 22px;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa 0%, #f093fb 100%);
    border: none; color: #fff;
    font-size: 30px; cursor: pointer;
    box-shadow:
      0 12px 40px rgba(167,139,250,0.6),
      0 0 0 0 rgba(167,139,250,0.7);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    transition: transform .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: fabPulse 2s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 12px 40px rgba(167,139,250,0.6), 0 0 0 0 rgba(167,139,250,0.7); }
    50% { box-shadow: 0 12px 40px rgba(167,139,250,0.8), 0 0 0 12px rgba(167,139,250,0); }
  }
  .admin-fab:active { transform: scale(0.9); }
  .admin-fab.show { display: flex; }

  /* Модалка */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 500; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(180deg, #16162a 0%, #0d0d1a 100%);
    width: 100%; max-width: 500px;
    border-radius: 28px 28px 0 0;
    max-height: 85vh; overflow-y: auto;
    animation: slideUp .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding-bottom: 24px;
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

  .modal-header {
    padding: 18px 22px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0;
    background: rgba(22,22,42,0.95);
    backdrop-filter: blur(20px);
    z-index: 10;
  }
  .modal-title { font-size: 18px; font-weight: 900; }
  .modal-close {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.15); }

  .participant {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background .2s;
  }
  .participant:hover { background: rgba(255,255,255,0.03); }
  .participant-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }
  .participant-info { flex: 1; min-width: 0; }
  .participant-name {
    font-size: 14px; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .participant-username { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .participant-date { font-size: 11px; color: var(--hint); font-weight: 700; }
</style>
</head>
<body>

<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="bg-glow g3"></div>
<div class="stars" id="stars"></div>

<div class="topbar">
  <div class="logo">🎁 Розыгрыши</div>
  <div class="user-badge" id="userBadge">
    <div class="avatar-mini" id="userAvatarMini">?</div>
    <span id="userNameMini">Гость</span>
  </div>
</div>

<div class="main">

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="active">🔥 Активные</div>
    <div class="tab" data-tab="finished">🏆 Завершённые</div>
    <div class="tab" data-tab="create" id="tabCreate" style="display:none;">➕ Создать</div>
  </div>

  <div id="view-active">
    <div class="loading" id="loadingActive">
      <div class="spinner"></div>
      Загрузка розыгрышей...
    </div>
    <div id="listActive"></div>
  </div>

  <div id="view-finished" style="display:none;">
    <div id="listFinished"></div>
  </div>

  <div id="view-create" style="display:none;">
    <div class="form-card">
      <div class="form-title">🎁 Новый розыгрыш</div>

      <div class="field">
        <label class="field-label">Название *</label>
        <input class="input" id="fTitle" placeholder="Например: Розыгрыш Telegram Premium" maxlength="80">
      </div>

      <div class="field">
        <label class="field-label">Приз</label>
        <input class="input" id="fPrize" placeholder="Например: Premium на 3 месяца" maxlength="80">
      </div>

      <div class="field">
        <label class="field-label">Описание</label>
        <textarea class="textarea" id="fDesc" placeholder="Условия розыгрыша..." maxlength="500"></textarea>
      </div>

      <div class="field">
        <label class="field-label">Фото</label>
        <input type="file" id="fPhotoFile" accept="image/*" style="display:none" onchange="onPhotoSelected(event)">
        <div id="photoDrop" class="photo-drop" onclick="document.getElementById('fPhotoFile').click()">
          <div id="photoPreviewWrap" style="display:none; position:relative;">
            <img id="photoPreview" class="photo-preview" alt="">
            <button type="button" class="photo-remove" onclick="event.stopPropagation(); removePhoto();">✕</button>
          </div>
          <div id="photoPlaceholder">
            <div class="photo-placeholder-icon">📸</div>
            <div class="photo-placeholder-text">Нажми, чтобы выбрать фото</div>
          </div>
        </div>
        <div id="photoStatus" class="photo-status"></div>
      </div>

      <div class="form-row">
        <div class="field">
          <label class="field-label">Длительность</label>
          <input class="input" id="fHours" type="number" value="24" min="1" max="720">
        </div>
        <div class="field" style="flex:0 0 130px;">
          <label class="field-label">Ед.</label>
          <select class="input" id="fUnit" style="padding:14px 12px;">
            <option value="hours">часов</option>
            <option value="minutes">минут</option>
            <option value="days">дней</option>
          </select>
        </div>
      </div>

      <button class="form-btn" id="createBtn" onclick="createGiveaway()">
        ✨ Создать розыгрыш
      </button>
    </div>
  </div>

</div>

<button class="admin-fab" id="adminFab" onclick="openCreateTab()">➕</button>

<div class="modal-overlay" id="participantsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">👥 Участники</div>
      <button class="modal-close" onclick="closeParticipants()">✕</button>
    </div>
    <div id="participantsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';
var ADMIN_ID = 8309824939;

// ==========================================================
// TELEGRAM
// ==========================================================
var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#07070f'); } catch(e) {}
try { tg.setBackgroundColor('#07070f'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };
var isAdmin = String(user.id) === String(ADMIN_ID);

// ==========================================================
// ЗВЁЗДЫ НА ФОНЕ
// ==========================================================
function initStars() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 50; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    var size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.appendChild(s);
  }
}

function initUserUI() {
  var initials = (user.first_name ? user.first_name[0] : '') + (user.last_name ? user.last_name[0] : '');
  document.getElementById('userAvatarMini').textContent = (initials || '?').toUpperCase();
  document.getElementById('userNameMini').textContent = user.first_name || 'Гость';
  if (isAdmin) {
    document.getElementById('adminFab').classList.add('show');
    document.getElementById('tabCreate').style.display = 'block';
  }
}

// ==========================================================
// СОСТОЯНИЕ
// ==========================================================
var giveaways = [];
var myJoins = [];
// ⭐ Ключ localStorage уникален для каждого юзера — фикс бага с чужим участием
var myJoinsKey = 'myJoins_' + (user.id || 0);
try {
  var saved = localStorage.getItem(myJoinsKey);
  if (saved) myJoins = JSON.parse(saved);
} catch(e) {}

// ==========================================================
// API
// ==========================================================
function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch (e) { reject(new Error('Bad JSON: ' + xhr.responseText.slice(0, 100))); }
        } else {
          reject(new Error('HTTP ' + xhr.status + ': ' + xhr.responseText.slice(0, 100)));
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}

function apiGet(path) { return apiRequest('GET', path); }
function apiPost(path, body) { return apiRequest('POST', path, body); }

// ==========================================================
// ЗАГРУЗКА
// ==========================================================
function loadGiveaways() {
  apiGet('/api/giveaways')
    .then(function(data) { giveaways = data || []; renderAll(); })
    .catch(function(e) { showToast('Ошибка загрузки: ' + e.message, 'error'); })
    .finally(function() { document.getElementById('loadingActive').style.display = 'none'; });
}

function renderAll() { renderActive(); renderFinished(); }

function renderActive() {
  var active = giveaways.filter(function(g) { return g.status === 'active'; });
  var el = document.getElementById('listActive');
  if (active.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🎈</div>' +
      '<div class="empty-title">Пока нет активных розыгрышей</div>' +
      '<div class="empty-sub">Заходи позже — админ скоро что-то запустит!</div></div>';
    return;
  }
  el.innerHTML = active.map(function(g) { return renderGiveawayCard(g, 'active'); }).join('');
}

function renderFinished() {
  var finished = giveaways.filter(function(g) { return g.status === 'finished'; });
  var el = document.getElementById('listFinished');
  if (finished.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏆</div>' +
      '<div class="empty-title">Завершённых пока нет</div>' +
      '<div class="empty-sub">Когда розыгрыш закончится — появится здесь</div></div>';
    return;
  }
  el.innerHTML = finished.map(function(g) { return renderGiveawayCard(g, 'finished'); }).join('');
}

function renderGiveawayCard(g, mode) {
  var joined = myJoins.indexOf(g.id) !== -1;
  var endsIn = formatTimeLeft(g.endsAt);
  var photoHtml;
  if (g.photoFileId) {
    var photoSrc = API_URL + '/api/photo/' + encodeURIComponent(g.photoFileId);
    photoHtml = '<img class="giveaway-photo" src="' + photoSrc + '" alt="">';
  } else if (g.photoUrl) {
    photoHtml = '<img class="giveaway-photo" src="' + escapeHtml(g.photoUrl) + '" alt="">';
  } else {
    photoHtml = '<div class="giveaway-photo-placeholder">🎁</div>';
  }

  var footer = '';
  if (mode === 'active') {
    if (isAdmin) {
      footer = '<div class="giveaway-footer">' +
        '<button class="btn btn-primary ' + (joined ? 'joined' : '') + '" onclick="toggleJoin(\'' + g.id + '\', ' + joined + ')">' +
          (joined ? '✓ Участвуешь' : '🎯 Участвовать') + '</button>' +
        '<button class="btn btn-small" onclick="openParticipants(\'' + g.id + '\')">👥 ' + (g.participantCount || 0) + '</button>' +
        '<button class="btn btn-small danger" onclick="pickWinner(\'' + g.id + '\')" title="Выбрать победителя">🎲</button>' +
        '</div>';
    } else {
      footer = '<div class="giveaway-footer">' +
        '<button class="btn btn-primary ' + (joined ? 'joined' : '') + '" onclick="toggleJoin(\'' + g.id + '\', ' + joined + ')">' +
          (joined ? '✓ Участвуешь' : '🎯 Участвовать') + '</button>' +
        '<button class="btn btn-small" onclick="openParticipants(\'' + g.id + '\')">👥 ' + (g.participantCount || 0) + '</button>' +
        '</div>';
    }
  } else {
    // Завершённый
    if (g.winnerId) {
      var isMe = String(g.winnerId) === String(user.id);
      footer = '<div class="winner-block"><div class="icon">' + (isMe ? '🏆' : '🎉') + '</div>' +
        '<div class="info"><div class="label">' + (isMe ? 'ТЫ ПОБЕДИЛ!' : 'Победитель') + '</div>' +
        '<div class="name">' + escapeHtml(g.winnerName || 'Участник') + '</div></div></div>';
    } else {
      footer = '<div class="winner-block" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);">' +
        '<div class="icon" style="filter:none">😔</div>' +
        '<div class="info"><div class="label" style="color:rgba(255,255,255,0.5)">Результат</div>' +
        '<div class="name" style="color:rgba(255,255,255,0.6);text-shadow:none">Никто не участвовал</div></div></div>';
    }

    // Админ может удалить завершённый розыгрыш
    if (isAdmin) {
      footer += '<div style="margin-top:10px;">' +
        '<button class="btn btn-small danger" style="width:100%" onclick="deleteGiveaway(\'' + g.id + '\', \'' + escapeJs(g.title) + '\')">' +
        '🗑 Удалить розыгрыш</button></div>';
    }
  }

  var metaHtml = '<div class="giveaway-meta">' +
    '<span>⏰ ' + (mode === 'active' ? endsIn : 'Завершён') + '</span>' +
    '<span>👥 <b>' + (g.participantCount || 0) + '</b> участников</span></div>';

  return '<div class="giveaway"><div style="position:relative;">' + photoHtml +
    '<div class="giveaway-badge ' + mode + '">' + (mode === 'active' ? 'Активен' : 'Завершён') + '</div></div>' +
    '<div class="giveaway-body">' +
      '<div class="giveaway-title">' + escapeHtml(g.title) + '</div>' +
      (g.description ? '<div class="giveaway-desc">' + escapeHtml(g.description) + '</div>' : '') +
      (g.prize ? '<div class="giveaway-prize">🏆 ' + escapeHtml(g.prize) + '</div>' : '') +
      metaHtml + footer + '</div></div>';
}

// ==========================================================
// УЧАСТИЕ
// ==========================================================
function toggleJoin(id, joined) {
  if (joined) { showToast('Ты уже участвуешь 👌'); return; }
  apiPost('/api/join', {
    giveawayId: id, userId: user.id,
    firstName: user.first_name || '',
    lastName: user.last_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    myJoins.push(id);
    // ⭐ сохраняем в ключ, уникальный для юзера
    try { localStorage.setItem(myJoinsKey, JSON.stringify(myJoins)); } catch(e) {}
    showToast('🎉 Ты участвуешь!', 'success');
    loadGiveaways();
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

// ==========================================================
// ФОТО
// ==========================================================
var photoFileId = '';
var photoUrl = '';

function onPhotoSelected(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    setPhotoStatus('Файл больше 5 МБ', 'error'); return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result;
    document.getElementById('photoPreview').src = base64;
    document.getElementById('photoPreviewWrap').style.display = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
    setPhotoStatus('⏳ Загружаю в Telegram...', '');
    uploadPhoto(base64, file.type);
  };
  reader.readAsDataURL(file);
}

function uploadPhoto(base64, contentType) {
  apiPost('/api/upload-photo', { base64: base64, contentType: contentType })
    .then(function(res) {
      if (res.error) { setPhotoStatus('Ошибка: ' + res.error, 'error'); return; }
      photoFileId = res.fileId || '';
      photoUrl = res.url || '';
      setPhotoStatus('✅ Фото загружено', 'success');
    })
    .catch(function(e) { setPhotoStatus('Ошибка: ' + e.message, 'error'); });
}

function removePhoto() {
  photoFileId = ''; photoUrl = '';
  document.getElementById('photoPreviewWrap').style.display = 'none';
  document.getElementById('photoPlaceholder').style.display = 'block';
  document.getElementById('fPhotoFile').value = '';
  setPhotoStatus('', '');
}

function setPhotoStatus(text, type) {
  var el = document.getElementById('photoStatus');
  el.textContent = text;
  el.className = 'photo-status';
  if (type) el.classList.add(type);
}

// ==========================================================
// СОЗДАНИЕ
// ==========================================================
function createGiveaway() {
  if (!isAdmin) { showToast('Только админ может создавать', 'error'); return; }
  var title = document.getElementById('fTitle').value.trim();
  var desc = document.getElementById('fDesc').value.trim();
  var prize = document.getElementById('fPrize').value.trim();
  var hours = Number(document.getElementById('fHours').value) || 24;
  var unit = document.getElementById('fUnit').value;
  if (!title) { showToast('Впиши название!', 'error'); return; }

  var durationMs = hours * 60 * 60 * 1000;
  if (unit === 'minutes') durationMs = hours * 60 * 1000;
  if (unit === 'days') durationMs = hours * 24 * 60 * 60 * 1000;

  var btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Создаём...';

  apiPost('/api/create', {
    adminId: user.id, title: title, description: desc,
    prize: prize, photoUrl: photoUrl, photoFileId: photoFileId,
    endsAt: Date.now() + durationMs,
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast('✨ Создано! Уведомление разослано', 'success');
    document.getElementById('fTitle').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fPrize').value = '';
    document.getElementById('fHours').value = 24;
    removePhoto();
    switchTab('active');
    loadGiveaways();
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '✨ Создать розыгрыш';
    });
}

// ==========================================================
// ВЫБОР ПОБЕДИТЕЛЯ
// ==========================================================
function pickWinner(id) {
  if (!isAdmin) return;
  if (!confirm('Выбрать случайного победителя? Необратимо.')) return;
  apiPost('/api/pick-winner', { giveawayId: id, adminId: user.id })
    .then(function(res) {
      if (res.error) { showToast(res.error, 'error'); return; }
      showToast('🏆 Победитель выбран! Уведомление разослано', 'success');
      loadGiveaways();
    })
    .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

// ==========================================================
// УДАЛЕНИЕ РОЗЫГРЫША (админ)
// ==========================================================
function deleteGiveaway(id, title) {
  if (!isAdmin) return;
  if (!confirm('Удалить розыгрыш «' + (title || '') + '»? Действие необратимо.')) return;
  apiPost('/api/delete', { giveawayId: id, adminId: user.id })
    .then(function(res) {
      if (res.error) { showToast(res.error, 'error'); return; }
      showToast('🗑 Розыгрыш удалён', 'success');
      loadGiveaways();
    })
    .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

// ==========================================================
// УЧАСТНИКИ
// ==========================================================
function openParticipants(id) {
  apiGet('/api/giveaway/' + id).then(function(data) {
    var parts = data.participants || [];
    var el = document.getElementById('participantsList');
    if (parts.length === 0) {
      el.innerHTML = '<div class="empty" style="padding:40px 20px;"><div class="empty-icon">👥</div><div class="empty-title">Пока никто не участвует</div></div>';
    } else {
      el.innerHTML = parts.map(function(p) {
        var initials = (p.firstName ? p.firstName[0] : '') + (p.lastName ? p.lastName[0] : '');
        return '<div class="participant">' +
          '<div class="participant-avatar">' + escapeHtml((initials || '?').toUpperCase()) + '</div>' +
          '<div class="participant-info"><div class="participant-name">' +
          escapeHtml([p.firstName, p.lastName].filter(Boolean).join(' ') || 'Участник') + '</div>' +
          (p.username ? '<div class="participant-username">@' + escapeHtml(p.username) + '</div>' : '') +
          '</div><div class="participant-date">' + formatDate(p.joinedAt) + '</div></div>';
      }).join('');
    }
    document.getElementById('participantsModal').classList.add('show');
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

function closeParticipants() {
  document.getElementById('participantsModal').classList.remove('show');
}

// ==========================================================
// ТАБЫ
// ==========================================================
function switchTab(tab) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
  }
  document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
  document.getElementById('view-finished').style.display = tab === 'finished' ? 'block' : 'none';
  document.getElementById('view-create').style.display = tab === 'create' ? 'block' : 'none';
  document.getElementById('adminFab').style.display = (isAdmin && tab !== 'create') ? 'flex' : 'none';
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() { switchTab(t.getAttribute('data-tab')); });
});

function openCreateTab() { switchTab('create'); }

// ==========================================================
// УТИЛИТЫ
// ==========================================================
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

function escapeJs(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ');
}

function formatTimeLeft(endsAt) {
  var diff = endsAt - Date.now();
  if (diff <= 0) return 'Завершён';
  var d = Math.floor(diff / 86400000);
  var h = Math.floor((diff % 86400000) / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return d + 'д ' + h + 'ч';
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + 'м';
}

function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}

function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

setInterval(function() {
  var hasActive = giveaways.some(function(g) { return g.status === 'active'; });
  if (hasActive) renderActive();
}, 60000);

// ==========================================================
// СТАРТ
// ==========================================================
initStars();
initUserUI();
loadGiveaways();
</script>
</body>
</html>
