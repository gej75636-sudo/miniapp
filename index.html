<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Розыгрыши</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg: #0d0d14;
    --card: #1a1a2e;
    --accent: #a78bfa;
    --gold: #fbbf24;
    --text: #fff;
    --hint: rgba(255,255,255,0.5);
    --success: #4ade80;
    --danger: #ef4444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 90px; overflow-x: hidden;
  }
  .bg-glow { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; opacity: 0.3; }
  .g1 { width: 400px; height: 400px; background: #667eea; top: -180px; right: -150px; }
  .g2 { width: 350px; height: 350px; background: #f093fb; bottom: -150px; left: -150px; }
  .g3 { width: 300px; height: 300px; background: #fbbf24; top: 40%; right: -100px; opacity: 0.15; }
  .topbar {
    position: sticky; top: 0; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    background: rgba(13, 13, 20, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo {
    font-size: 19px; font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .user-badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px; border-radius: 12px;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .avatar-mini {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
  }
  .main { position: relative; z-index: 2; padding: 16px; }
  .tabs {
    display: flex; gap: 6px;
    background: rgba(255,255,255,0.05);
    padding: 4px; border-radius: 14px; margin-bottom: 20px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px;
    border-radius: 10px; font-size: 12px; font-weight: 700;
    color: var(--hint); cursor: pointer; transition: all .2s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }
  .giveaway {
    background: var(--card); border-radius: 20px; overflow: hidden;
    margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.06);
    animation: fadeIn .4s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .giveaway-photo { width: 100%; height: 180px; object-fit: cover; background: linear-gradient(135deg, #1a1a2e, #2a2a4e); display: block; }
  .giveaway-photo-placeholder {
    width: 100%; height: 180px;
    background: linear-gradient(135deg, #4c1d95, #7c3aed);
    display: flex; align-items: center; justify-content: center; font-size: 64px;
  }
  .giveaway-badge {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
    padding: 6px 12px; border-radius: 10px;
    font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .giveaway-badge.active { color: var(--success); border: 1px solid var(--success); }
  .giveaway-badge.finished { color: var(--hint); border: 1px solid var(--hint); }
  .giveaway-body { padding: 16px; }
  .giveaway-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; line-height: 1.3; }
  .giveaway-desc {
    font-size: 13px; color: var(--hint); line-height: 1.5; margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .giveaway-prize {
    display: inline-block;
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.15));
    border: 1px solid rgba(251,191,36,0.3);
    color: var(--gold); padding: 6px 12px; border-radius: 10px;
    font-size: 12px; font-weight: 700; margin-bottom: 12px;
  }
  .giveaway-meta {
    display: flex; gap: 12px; font-size: 12px;
    color: var(--hint); margin-bottom: 14px; flex-wrap: wrap;
  }
  .giveaway-meta span { display: flex; align-items: center; gap: 4px; }
  .giveaway-footer { display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 12px 18px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: transform .1s, opacity .2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
  }
  .btn-primary.joined {
    background: linear-gradient(135deg, #10b981, #047857);
    box-shadow: 0 6px 20px rgba(16,185,129,0.3);
  }
  .btn-primary:disabled {
    background: rgba(255,255,255,0.1);
    color: var(--hint); box-shadow: none; cursor: not-allowed;
  }
  .btn-small {
    padding: 12px 16px; font-size: 13px;
    background: rgba(255,255,255,0.08); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-small.danger {
    background: rgba(239,68,68,0.15); color: var(--danger);
    border-color: rgba(239,68,68,0.3);
  }
  .winner-block {
    background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(245,158,11,0.05));
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .winner-block .icon { font-size: 24px; }
  .winner-block .info { flex: 1; }
  .winner-block .label {
    font-size: 10px; color: var(--hint);
    text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;
  }
  .winner-block .name { font-size: 14px; font-weight: 800; color: var(--gold); }
  .form-card {
    background: var(--card); border-radius: 20px;
    padding: 20px; border: 1px solid rgba(255,255,255,0.06);
  }
  .form-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .field { margin-bottom: 14px; }
  .field-label {
    font-size: 12px; color: var(--hint);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 700; margin-bottom: 6px; display: block;
  }
  .input, .textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 13px 14px;
    font-size: 15px; color: var(--text); font-family: inherit;
    outline: none; transition: border-color .2s;
  }
  .input:focus, .textarea:focus { border-color: var(--accent); }
  .input::placeholder, .textarea::placeholder { color: rgba(255,255,255,0.3); }
  .textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }
  .form-btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 15px; font-weight: 800; cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #a78bfa, #f093fb);
    color: #fff; margin-top: 8px;
    box-shadow: 0 6px 24px rgba(167,139,250,0.4);
    transition: transform .1s;
  }
  .form-btn:active { transform: scale(0.98); }
  .form-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .photo-drop {
    width: 100%; min-height: 140px;
    background: rgba(255,255,255,0.05);
    border: 2px dashed rgba(255,255,255,0.15);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    transition: border-color .2s, background .2s;
    position: relative; padding: 12px;
  }
  .photo-drop:active { border-color: var(--accent); background: rgba(167,139,250,0.08); }
  .photo-preview { max-width: 100%; max-height: 200px; border-radius: 10px; display: block; }
  .photo-remove {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(239,68,68,0.95); color: #fff; border: none;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-placeholder-icon { font-size: 36px; text-align: center; margin-bottom: 6px; }
  .photo-placeholder-text { font-size: 13px; color: var(--hint); text-align: center; }
  .photo-status { font-size: 12px; color: var(--hint); margin-top: 6px; text-align: center; }
  .photo-status.success { color: var(--success); }
  .photo-status.error { color: var(--danger); }
  .empty { text-align: center; padding: 60px 20px; color: var(--hint); }
  .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .empty-sub { font-size: 13px; line-height: 1.5; }
  .loading { text-align: center; padding: 40px; color: var(--hint); font-size: 14px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(30,30,50,0.98);
    backdrop-filter: blur(20px); color: #fff;
    padding: 14px 22px; border-radius: 14px;
    font-size: 14px; font-weight: 700;
    z-index: 999;
    transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-width: 90%; text-align: center; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(4,120,87,0.95)); }
  .toast.error { border-color: var(--danger); background: linear-gradient(135deg, rgba(239,68,68,0.95), rgba(185,28,28,0.95)); }
  .admin-fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #f093fb);
    border: none; color: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(167,139,250,0.5);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .admin-fab:active { transform: scale(0.92); }
  .admin-fab.show { display: flex; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    z-index: 500; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; animation: fadeIn .25s; }
  .modal {
    background: var(--bg); width: 100%; max-width: 500px;
    border-radius: 24px 24px 0 0; max-height: 85vh; overflow-y: auto;
    animation: slideUp .3s; padding-bottom: 20px;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal-header {
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .modal-title { font-size: 17px; font-weight: 800; }
  .modal-close {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none;
    color: var(--text); font-size: 18px; cursor: pointer;
  }
  .participant {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .participant-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; flex-shrink: 0;
  }
  .participant-info { flex: 1; min-width: 0; }
  .participant-name {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .participant-username { font-size: 12px; color: var(--hint); }
  .participant-date { font-size: 11px; color: var(--hint); }
</style>
</head>
<body>

<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="bg-glow g3"></div>

<div class="topbar">
  <div class="logo">🎁 Розыгрыши</div>
  <div class="user-badge" id="userBadge">
    <div class="avatar-mini" id="userAvatarMini">?</div>
    <span id="userNameMini">Гость</span>
  </div>
</div>

<div class="main">

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="active">🔥 Активные</div>
    <div class="tab" data-tab="finished">🏆 Завершённые</div>
    <div class="tab" data-tab="create" id="tabCreate" style="display:none;">➕ Создать</div>
  </div>

  <div id="view-active">
    <div class="loading" id="loadingActive">
      <div class="spinner"></div>
      Загрузка розыгрышей...
    </div>
    <div id="listActive"></div>
  </div>

  <div id="view-finished" style="display:none;">
    <div id="listFinished"></div>
  </div>

  <div id="view-create" style="display:none;">
    <div class="form-card">
      <div class="form-title">🎁 Новый розыгрыш</div>

      <div class="field">
        <label class="field-label">Название *</label>
        <input class="input" id="fTitle" placeholder="Например: Розыгрыш Telegram Premium" maxlength="80">
      </div>

      <div class="field">
        <label class="field-label">Приз</label>
        <input class="input" id="fPrize" placeholder="Например: Premium на 3 месяца" maxlength="80">
      </div>

      <div class="field">
        <label class="field-label">Описание</label>
        <textarea class="textarea" id="fDesc" placeholder="Условия розыгрыша..." maxlength="500"></textarea>
      </div>

      <div class="field">
        <label class="field-label">Фото</label>
        <input type="file" id="fPhotoFile" accept="image/*" style="display:none" onchange="onPhotoSelected(event)">
        <div id="photoDrop" class="photo-drop" onclick="document.getElementById('fPhotoFile').click()">
          <div id="photoPreviewWrap" style="display:none;">
            <img id="photoPreview" class="photo-preview" alt="">
            <button type="button" class="photo-remove" onclick="event.stopPropagation(); removePhoto();">✕</button>
          </div>
          <div id="photoPlaceholder">
            <div class="photo-placeholder-icon">📸</div>
            <div class="photo-placeholder-text">Нажми, чтобы выбрать фото</div>
          </div>
        </div>
        <div id="photoStatus" class="photo-status"></div>
      </div>

      <div class="form-row">
        <div class="field">
          <label class="field-label">Длительность</label>
          <input class="input" id="fHours" type="number" value="24" min="1" max="720">
        </div>
        <div class="field" style="flex:0 0 120px;">
          <label class="field-label">Ед.</label>
          <select class="input" id="fUnit" style="padding:13px 10px;">
            <option value="hours">часов</option>
            <option value="minutes">минут</option>
            <option value="days">дней</option>
          </select>
        </div>
      </div>

      <button class="form-btn" id="createBtn" onclick="createGiveaway()">
        ✨ Создать розыгрыш
      </button>
    </div>
  </div>

</div>

<button class="admin-fab" id="adminFab" onclick="openCreateTab()">➕</button>

<div class="modal-overlay" id="participantsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">👥 Участники</div>
      <button class="modal-close" onclick="closeParticipants()">✕</button>
    </div>
    <div id="participantsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';
var ADMIN_ID = 8309824939;

var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#0d0d14'); } catch(e) {}
try { tg.setBackgroundColor('#0d0d14'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };
var isAdmin = String(user.id) === String(ADMIN_ID);

function initUserUI() {
  var initials = (user.first_name ? user.first_name[0] : '') + (user.last_name ? user.last_name[0] : '');
  document.getElementById('userAvatarMini').textContent = (initials || '?').toUpperCase();
  document.getElementById('userNameMini').textContent = user.first_name || 'Гость';
  if (isAdmin) {
    document.getElementById('adminFab').classList.add('show');
    document.getElementById('tabCreate').style.display = 'block';
  }
}

var giveaways = [];
var myJoins = [];
try {
  var saved = localStorage.getItem('myJoins');
  if (saved) myJoins = JSON.parse(saved);
} catch(e) {}

function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch (e) { reject(new Error('Bad JSON: ' + xhr.responseText.slice(0, 100))); }
        } else {
          reject(new Error('HTTP ' + xhr.status + ': ' + xhr.responseText.slice(0, 100)));
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}

function apiGet(path) { return apiRequest('GET', path); }
function apiPost(path, body) { return apiRequest('POST', path, body); }

function loadGiveaways() {
  apiGet('/api/giveaways')
    .then(function(data) { giveaways = data || []; renderAll(); })
    .catch(function(e) { showToast('Ошибка загрузки: ' + e.message, 'error'); })
    .finally(function() { document.getElementById('loadingActive').style.display = 'none'; });
}

function renderAll() { renderActive(); renderFinished(); }

function renderActive() {
  var active = giveaways.filter(function(g) { return g.status === 'active'; });
  var el = document.getElementById('listActive');
  if (active.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🎈</div>' +
      '<div class="empty-title">Пока нет активных розыгрышей</div>' +
      '<div class="empty-sub">Заходи позже — админ скоро что-то запустит!</div></div>';
    return;
  }
  el.innerHTML = active.map(function(g) { return renderGiveawayCard(g, 'active'); }).join('');
}

function renderFinished() {
  var finished = giveaways.filter(function(g) { return g.status === 'finished'; });
  var el = document.getElementById('listFinished');
  if (finished.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏆</div>' +
      '<div class="empty-title">Завершённых пока нет</div>' +
      '<div class="empty-sub">Когда розыгрыш закончится — появится здесь</div></div>';
    return;
  }
  el.innerHTML = finished.map(function(g) { return renderGiveawayCard(g, 'finished'); }).join('');
}

function renderGiveawayCard(g, mode) {
  var joined = myJoins.indexOf(g.id) !== -1;
  var endsIn = formatTimeLeft(g.endsAt);
  var photoHtml;
  if (g.photoFileId) {
    var photoSrc = API_URL + '/api/photo/' + encodeURIComponent(g.photoFileId);
    photoHtml = '<img class="giveaway-photo" src="' + photoSrc + '" alt="">';
  } else if (g.photoUrl) {
    photoHtml = '<img class="giveaway-photo" src="' + escapeHtml(g.photoUrl) + '" alt="">';
  } else {
    photoHtml = '<div class="giveaway-photo-placeholder">🎁</div>';
  }

  var footer = '';
  if (mode === 'active') {
    if (isAdmin) {
      footer = '<div class="giveaway-footer">' +
        '<button class="btn btn-primary ' + (joined ? 'joined' : '') + '" onclick="toggleJoin(\'' + g.id + '\', ' + joined + ')">' +
          (joined ? '✓ Участвуешь' : '🎯 Участвовать') + '</button>' +
        '<button class="btn btn-small" onclick="openParticipants(\'' + g.id + '\')">👥 ' + (g.participantCount || 0) + '</button>' +
        '<button class="btn btn-small danger" onclick="pickWinner(\'' + g.id + '\')">🎲</button></div>';
    } else {
      footer = '<div class="giveaway-footer">' +
        '<button class="btn btn-primary ' + (joined ? 'joined' : '') + '" onclick="toggleJoin(\'' + g.id + '\', ' + joined + ')">' +
          (joined ? '✓ Участвуешь' : '🎯 Участвовать') + '</button>' +
        '<button class="btn btn-small" onclick="openParticipants(\'' + g.id + '\')">👥 ' + (g.participantCount || 0) + '</button></div>';
    }
  } else {
    if (g.winnerId) {
      var isMe = String(g.winnerId) === String(user.id);
      footer = '<div class="winner-block"><div class="icon">' + (isMe ? '🏆' : '🎉') + '</div>' +
        '<div class="info"><div class="label">' + (isMe ? 'ТЫ ПОБЕДИЛ!' : 'Победитель') + '</div>' +
        '<div class="name">' + escapeHtml(g.winnerName || 'Участник') + '</div></div></div>';
    }
  }

  var metaHtml = '<div class="giveaway-meta">' +
    '<span>⏰ ' + (mode === 'active' ? endsIn : 'Завершён') + '</span>' +
    '<span>👥 ' + (g.participantCount || 0) + ' участников</span></div>';

  return '<div class="giveaway"><div style="position:relative;">' + photoHtml +
    '<div class="giveaway-badge ' + mode + '">' + (mode === 'active' ? '🔥 Активен' : '🏁 Завершён') + '</div></div>' +
    '<div class="giveaway-body">' +
      '<div class="giveaway-title">' + escapeHtml(g.title) + '</div>' +
      (g.description ? '<div class="giveaway-desc">' + escapeHtml(g.description) + '</div>' : '') +
      (g.prize ? '<div class="giveaway-prize">🏆 ' + escapeHtml(g.prize) + '</div>' : '') +
      metaHtml + footer + '</div></div>';
}

function toggleJoin(id, joined) {
  if (joined) { showToast('Ты уже участвуешь 👌'); return; }
  apiPost('/api/join', {
    giveawayId: id, userId: user.id,
    firstName: user.first_name || '',
    lastName: user.last_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    myJoins.push(id);
    try { localStorage.setItem('myJoins', JSON.stringify(myJoins)); } catch(e) {}
    showToast('🎉 Ты участвуешь!', 'success');
    loadGiveaways();
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

var photoFileId = '';
var photoUrl = '';

function onPhotoSelected(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    setPhotoStatus('Файл больше 5 МБ', 'error'); return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result;
    document.getElementById('photoPreview').src = base64;
    document.getElementById('photoPreviewWrap').style.display = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
    setPhotoStatus('⏳ Загружаю в Telegram...', '');
    uploadPhoto(base64, file.type);
  };
  reader.readAsDataURL(file);
}

function uploadPhoto(base64, contentType) {
  apiPost('/api/upload-photo', { base64: base64, contentType: contentType })
    .then(function(res) {
      if (res.error) { setPhotoStatus('Ошибка: ' + res.error, 'error'); return; }
      photoFileId = res.fileId || '';
      photoUrl = res.url || '';
      setPhotoStatus('✅ Фото загружено', 'success');
    })
    .catch(function(e) { setPhotoStatus('Ошибка: ' + e.message, 'error'); });
}

function removePhoto() {
  photoFileId = ''; photoUrl = '';
  document.getElementById('photoPreviewWrap').style.display = 'none';
  document.getElementById('photoPlaceholder').style.display = 'block';
  document.getElementById('fPhotoFile').value = '';
  setPhotoStatus('', '');
}

function setPhotoStatus(text, type) {
  var el = document.getElementById('photoStatus');
  el.textContent = text;
  el.className = 'photo-status';
  if (type) el.classList.add(type);
}

function createGiveaway() {
  if (!isAdmin) { showToast('Только админ может создавать', 'error'); return; }
  var title = document.getElementById('fTitle').value.trim();
  var desc = document.getElementById('fDesc').value.trim();
  var prize = document.getElementById('fPrize').value.trim();
  var hours = Number(document.getElementById('fHours').value) || 24;
  var unit = document.getElementById('fUnit').value;
  if (!title) { showToast('Впиши название!', 'error'); return; }

  var durationMs = hours * 60 * 60 * 1000;
  if (unit === 'minutes') durationMs = hours * 60 * 1000;
  if (unit === 'days') durationMs = hours * 24 * 60 * 60 * 1000;

  var btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Создаём...';

  apiPost('/api/create', {
    adminId: user.id, title: title, description: desc,
    prize: prize, photoUrl: photoUrl, photoFileId: photoFileId,
    endsAt: Date.now() + durationMs,
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast('✨ Создано! Уведомление разослано', 'success');
    document.getElementById('fTitle').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fPrize').value = '';
    document.getElementById('fHours').value = 24;
    removePhoto();
    switchTab('active');
    loadGiveaways();
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '✨ Создать розыгрыш';
    });
}

function pickWinner(id) {
  if (!isAdmin) return;
  if (!confirm('Выбрать случайного победителя? Необратимо.')) return;
  apiPost('/api/pick-winner', { giveawayId: id, adminId: user.id })
    .then(function(res) {
      if (res.error) { showToast(res.error, 'error'); return; }
      showToast('🏆 Победитель выбран!', 'success');
      loadGiveaways();
    })
    .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

function openParticipants(id) {
  apiGet('/api/giveaway/' + id).then(function(data) {
    var parts = data.participants || [];
    var el = document.getElementById('participantsList');
    if (parts.length === 0) {
      el.innerHTML = '<div class="empty" style="padding:40px 20px;"><div class="empty-icon">👥</div><div class="empty-title">Пока никто не участвует</div></div>';
    } else {
      el.innerHTML = parts.map(function(p) {
        var initials = (p.firstName ? p.firstName[0] : '') + (p.lastName ? p.lastName[0] : '');
        return '<div class="participant">' +
          '<div class="participant-avatar">' + escapeHtml((initials || '?').toUpperCase()) + '</div>' +
          '<div class="participant-info"><div class="participant-name">' +
          escapeHtml([p.firstName, p.lastName].filter(Boolean).join(' ') || 'Участник') + '</div>' +
          (p.username ? '<div class="participant-username">@' + escapeHtml(p.username) + '</div>' : '') +
          '</div><div class="participant-date">' + formatDate(p.joinedAt) + '</div></div>';
      }).join('');
    }
    document.getElementById('participantsModal').classList.add('show');
  }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
}

function closeParticipants() {
  document.getElementById('participantsModal').classList.remove('show');
}

function switchTab(tab) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
  }
  document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
  document.getElementById('view-finished').style.display = tab === 'finished' ? 'block' : 'none';
  document.getElementById('view-create').style.display = tab === 'create' ? 'block' : 'none';
  document.getElementById('adminFab').style.display = (isAdmin && tab !== 'create') ? 'flex' : 'none';
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() { switchTab(t.getAttribute('data-tab')); });
});

function openCreateTab() { switchTab('create'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

function formatTimeLeft(endsAt) {
  var diff = endsAt - Date.now();
  if (diff <= 0) return 'Завершён';
  var d = Math.floor(diff / 86400000);
  var h = Math.floor((diff % 86400000) / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return d + 'д ' + h + 'ч';
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + 'м';
}

function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}

function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

setInterval(function() {
  var hasActive = giveaways.some(function(g) { return g.status === 'active'; });
  if (hasActive) renderActive();
}, 60000);

initUserUI();
loadGiveaways();
</script>
