<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Квиз-Рулетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    /* Градиенты из картинки */
    --g1: linear-gradient(135deg, #00FF5B 0%, #0014FF 100%);   /* зелёный-синий */
    --g2: linear-gradient(135deg, #00E5FF 0%, #1200FF 100%);   /* циан-синий */
    --g3: linear-gradient(135deg, #FFE53B 0%, #FF2525 100%);   /* жёлтый-красный */
    --g4: linear-gradient(135deg, #FFE53B 0%, #FF005B 100%);   /* жёлтый-розовый */
    --g5: linear-gradient(135deg, #FFE53B 0%, #00FFFF 100%);   /* жёлтый-циан */
    --g6: linear-gradient(135deg, #FF0A6C 0%, #2D27FF 100%);   /* розовый-фиолетовый */

    --bg: #0a0e1f;
    --surface: #141a35;
    --surface-2: #1a2142;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #ffffff;
    --text-2: rgba(255,255,255,0.7);
    --text-3: rgba(255,255,255,0.4);
    --green: #00FF5B;
    --cyan: #00E5FF;
    --yellow: #FFE53B;
    --pink: #FF0A6C;
    --red: #FF2525;
    --blue: #0014FF;
    --purple: #2D27FF;
  }

  html, body { overscroll-behavior-y: none; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 30px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    font-weight: 500;
  }

  /* Мягкий фон с двумя пятнами */
  body::before {
    content: '';
    position: fixed;
    top: -300px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(45,39,255,0.25) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -300px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,10,108,0.18) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    background: rgba(10,14,31,0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }
  .logo-bar {
    width: 4px;
    height: 20px;
    border-radius: 2px;
    background: var(--g1);
    box-shadow: 0 0 12px rgba(0,255,91,0.6);
  }
  .logo-text {
    background: var(--g5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: rgba(0,255,91,0.1);
    border: 1px solid rgba(0,255,91,0.3);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 900;
    color: #00FF5B;
    letter-spacing: 0.5px;
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00FF5B;
    box-shadow: 0 0 10px #00FF5B;
    animation: livePulse 1.4s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .main { position: relative; z-index: 2; padding: 16px 16px 0; }

  /* Stats row */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    position: relative;
    padding: 16px 18px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--g1);
  }
  .stat.energy-stat::before { background: var(--g3); }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 900;
    color: var(--text-3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00FF5B;
    box-shadow: 0 0 8px #00FF5B;
  }
  .stat.energy-stat .stat-label .dot {
    background: #FFE53B;
    box-shadow: 0 0 8px #FFE53B;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .stat-value small {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-3);
  }
  .stat.balance-stat .stat-value .num {
    background: var(--g5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat.energy-stat .stat-value .num { color: #FFE53B; }
  .energy-bar {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .energy-bar-fill {
    height: 100%;
    background: var(--g3);
    border-radius: 4px;
    transition: width .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(255,229,59,0.7);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--surface);
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-3);
    cursor: pointer;
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
  }
  .tab.active {
    color: #fff;
    background: var(--g6);
    box-shadow: 0 6px 18px rgba(45,39,255,0.4);
  }

  /* ===== WHEEL ===== */
  .wheel-container {
    display: flex;
    justify-content: center;
    padding: 20px 0 10px;
    position: relative;
  }
  .wheel-wrap {
    position: relative;
    width: min(310px, 82vw);
    aspect-ratio: 1;
  }
  .wheel-bg-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00FF5B, #00E5FF, #2D27FF, #FF0A6C, #FFE53B, #FF2525, #00FF5B);
    animation: spinSlow 8s linear infinite;
    z-index: 0;
    filter: blur(2px);
    opacity: 0.55;
  }
  @keyframes spinSlow {
    to { transform: rotate(360deg); }
  }
  .wheel-inner-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, #10152e, #060a1c);
    z-index: 1;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.6),
      0 8px 40px rgba(0,0,0,0.5);
  }
  #wheelCanvas {
    position: absolute;
    inset: 10px;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    border-radius: 50%;
    z-index: 2;
    transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.35, 1);
    will-change: transform;
    filter: drop-shadow(0 0 20px rgba(45,39,255,0.5));
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    filter: drop-shadow(0 4px 12px rgba(255,229,59,0.9));
  }
  .pointer-tri {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 26px solid #FFE53B;
  }
  .pointer-top {
    position: absolute;
    top: -12px;
    left: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFE53B, #FFE53B 40%, transparent 70%);
    animation: pointerBlink 1.2s ease-in-out infinite;
  }
  @keyframes pointerBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.5); }
  }

  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    background: var(--g6);
    color: #fff;
    cursor: pointer;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    overflow: hidden;
    transition: transform .15s;
    box-shadow:
      0 10px 32px rgba(45,39,255,0.7),
      0 0 0 6px rgba(255,10,108,0.15),
      inset 0 -4px 12px rgba(0,0,0,0.4),
      inset 0 3px 10px rgba(255,255,255,0.25);
  }
  .spin-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
    animation: btnShineMove 2.6s ease-in-out infinite;
  }
  @keyframes btnShineMove {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(150%); }
  }
  .spin-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.92); }
  .spin-btn:disabled {
    background: linear-gradient(135deg, #3a3a55, #2a2a44);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    cursor: not-allowed;
    opacity: 0.7;
  }
  .spin-btn:disabled::before { display: none; }
  .spin-btn .em {
    font-size: clamp(22px, 6vw, 30px);
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .spin-btn .tx {
    font-size: clamp(8px, 2.3vw, 11px);
    position: relative;
    z-index: 1;
  }

  .spin-info {
    text-align: center;
    font-size: 13px;
    color: var(--text-3);
    font-weight: 700;
    margin-top: 14px;
    letter-spacing: -0.1px;
  }
  .spin-info.warn { color: #FFE53B; }
  .spin-info.err { color: #FF2525; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    animation: cardIn .35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(15px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .card-top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--g1);
  }

  .level-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(255,229,59,0.1);
    border: 1px solid rgba(255,229,59,0.35);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 900;
    color: #FFE53B;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .level-chip::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #FFE53B;
    box-shadow: 0 0 10px #FFE53B;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .question-text {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -0.4px;
    margin-bottom: 22px;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    padding: 16px;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 12px;
    line-height: 1.35;
  }
  .answer:active {
    transform: scale(0.98);
    border-color: rgba(45,39,255,0.6);
  }
  .answer .letter {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: rgba(45,39,255,0.25);
    color: #7d78ff;
    font-weight: 900;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
  }
  .answer.correct {
    background: rgba(0,255,91,0.1);
    border-color: #00FF5B;
    color: #00FF5B;
    animation: correctPop .4s;
  }
  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .answer.correct .letter {
    background: rgba(0,255,91,0.25);
    color: #00FF5B;
  }
  .answer.wrong {
    background: rgba(255,37,37,0.1);
    border-color: #FF2525;
    color: #FF2525;
    animation: shake .35s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .answer.wrong .letter {
    background: rgba(255,37,37,0.25);
    color: #FF2525;
  }

  /* Result */
  .result-card {
    text-align: center;
    padding: 36px 24px 30px;
  }
  .result-card .card-top-bar.win { background: var(--g1); }
  .result-card .card-top-bar.lose { background: var(--g3); }
  .result-icon {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 14px;
    display: inline-block;
    animation: resultBounce .6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes resultBounce {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: -0.8px;
  }
  .result-title.win {
    background: var(--g1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-title.lose { color: #FF2525; }
  .result-sub {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 22px;
    font-weight: 600;
  }
  .points-box {
    display: inline-block;
    font-size: 42px;
    font-weight: 900;
    color: #FFE53B;
    padding: 12px 26px;
    background: rgba(255,229,59,0.1);
    border: 2px solid rgba(255,229,59,0.4);
    border-radius: 18px;
    margin-bottom: 26px;
    letter-spacing: -1.5px;
    animation: pointsPop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pointsPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .points-box.zero {
    color: var(--text-3);
    background: rgba(255,255,255,0.04);
    border-color: var(--border);
  }

  /* Buttons */
  .btn {
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: -0.2px;
    color: #fff;
    width: 100%;
    margin-bottom: 10px;
    transition: transform .15s;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--g6);
    box-shadow: 0 10px 28px rgba(45,39,255,0.4);
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: btnShineMove 3s ease-in-out infinite;
  }
  .btn-secondary {
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
  }

  /* Shop */
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    font-weight: 900;
    color: var(--text-3);
    margin-bottom: 14px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    width: 20px;
    height: 2px;
    border-radius: 2px;
    background: var(--g1);
  }

  .shop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .gift {
    position: relative;
    padding: 18px 12px 16px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    border: 1.5px solid var(--border);
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    animation: cardIn .4s ease both;
  }
  .gift::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    transition: background .25s;
  }
  .gift:active { transform: scale(0.96); }
  .gift.affordable {
    border-color: rgba(0,255,91,0.35);
    box-shadow: 0 8px 30px rgba(0,255,91,0.12);
  }
  .gift.affordable::before { background: var(--g1); }
  .gift.affordable .price {
    color: #00FF5B;
    background: rgba(0,255,91,0.1);
    border-color: rgba(0,255,91,0.35);
  }
  .gift .check {
    position: absolute;
    top: 10px; right: 10px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--g1);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 4px 12px rgba(0,255,91,0.5);
    animation: checkPop .4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  .gift.affordable .check { display: flex; }
  .gift .em {
    font-size: 48px;
    display: block;
    line-height: 1;
    margin-bottom: 10px;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4));
    transition: transform .3s;
  }
  .gift:active .em { transform: scale(1.12) rotate(-4deg); }
  .gift .name {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .price {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 900;
    color: #FFE53B;
    background: rgba(255,229,59,0.1);
    border: 1px solid rgba(255,229,59,0.25);
    border-radius: 100px;
    transition: all .25s;
  }

  /* History */
  .history-item {
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    animation: cardIn .3s ease;
    position: relative;
    overflow: hidden;
  }
  .history-item .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--g3);
  }
  .history-item.fulfilled .bar { background: var(--g1); }
  .history-em { font-size: 32px; line-height: 1; }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .history-date {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 3px;
  }
  .status {
    display: inline-block;
    font-size: 9px;
    padding: 4px 10px;
    border-radius: 100px;
    text-transform: uppercase;
    font-weight: 900;
    letter-spacing: 0.6px;
    margin-top: 6px;
  }
  .status.pending {
    background: rgba(255,229,59,0.12);
    color: #FFE53B;
    border: 1px solid rgba(255,229,59,0.3);
  }
  .status.fulfilled {
    background: rgba(0,255,91,0.12);
    color: #00FF5B;
    border: 1px solid rgba(0,255,91,0.3);
  }
  .history-price {
    font-size: 14px;
    font-weight: 900;
    color: #FFE53B;
  }

  /* Empty */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
  }
  .empty-em {
    font-size: 72px;
    margin-bottom: 16px;
    opacity: 0.5;
    display: inline-block;
    animation: emptyFloat 3s ease-in-out infinite;
  }
  @keyframes emptyFloat {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }
  .empty-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
  }
  .empty-sub { font-size: 13px; line-height: 1.5; }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    padding: 14px 22px;
    border-radius: 14px;
    background: var(--surface-2);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    z-index: 9999;
    max-width: 88%;
    text-align: center;
    border: 1px solid var(--border-strong);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translate(-50%, 30px);
    transition: opacity .25s, transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    visibility: hidden;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
    visibility: visible;
  }
  .toast.success {
    background: linear-gradient(135deg, #00FF5B, #00b341);
    color: #062b14;
    border-color: transparent;
    box-shadow: 0 12px 40px rgba(0,255,91,0.4);
  }
  .toast.error {
    background: linear-gradient(135deg, #FF2525, #b31818);
    border-color: transparent;
    box-shadow: 0 12px 40px rgba(255,37,37,0.4);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: var(--surface);
    border-radius: 24px;
    padding: 30px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    border: 1px solid var(--border-strong);
    animation: popIn .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
  }
  .modal-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--g5);
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-em {
    font-size: 64px;
    margin-bottom: 16px;
    display: inline-block;
    animation: resultBounce .6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .modal-text {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.55;
    margin-bottom: 22px;
    font-weight: 500;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall 2.5s linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

        <div class="result-icon" id="resultIcon">🎉</div>
        <div class="result-title" id="resultTitle">Правильно!</div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-em" id="modalEmoji">🎁</div>
    <div class="modal-title" id="modalTitle">Успех!</div>
    <div class="modal-text" id="modalText"></div>
    <button class="btn btn-primary" onclick="closeModal()">Отлично</button>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';

var tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch(e) {}
try { tg.setHeaderColor('#0a0e1f'); } catch(e) {}
try { tg.setBackgroundColor('#0a0e1f'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };

function haptic(type) {
  try {
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch(e) {}
}

var state = {
  balance: 0,
  energy: 10,
  maxEnergy: 10,
  gifts: [],
  currentSpin: null,
  spinning: false,
  wheelRotation: 0,
  answered: false,
};

// Сегменты с градиентами из картинки
var SEGMENTS = [
  { points: 10,  c1: '#00FF5B', c2: '#00cc49', text: '10'  },
  { points: 20,  c1: '#00E5FF', c2: '#00b8cc', text: '20'  },
  { points: 30,  c1: '#2D27FF', c2: '#1a14cc', text: '30'  },
  { points: 50,  c1: '#FFE53B', c2: '#e6c400', text: '50'  },
  { points: 100, c1: '#FF0A6C', c2: '#cc084f', text: '100' },
  { points: 250, c1: '#FF2525', c2: '#cc1a1a', text: '250' },
];

// ==========================================================
// API
// ==========================================================
function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('Bad JSON')); }
        } else {
          try { reject(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('HTTP ' + xhr.status)); }
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}
function apiGet(p) { return apiRequest('GET', p); }
function apiPost(p, b) { return apiRequest('POST', p, b); }

// ==========================================================
// WHEEL
// ==========================================================
function drawWheel() {
  var c = document.getElementById('wheelCanvas');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var cx = W / 2, cy = H / 2;
  var r = Math.min(W, H) / 2 - 12;
  var seg = (Math.PI * 2) / SEGMENTS.length;

  ctx.clearRect(0, 0, W, H);

  for (var i = 0; i < SEGMENTS.length; i++) {
    var startAngle = i * seg - Math.PI / 2;
    var endAngle = startAngle + seg;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();

    // Радиальный градиент от светлого к тёмному
    var grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, r);
    grad.addColorStop(0, SEGMENTS[i].c1);
    grad.addColorStop(1, SEGMENTS[i].c2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Тонкая обводка
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Текст
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#fff';
    ctx.font = '900 68px Inter, -apple-system, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillText(SEGMENTS[i].text, r - 42, 0);

    // Звёздочка под числом
    ctx.font = '400 34px sans-serif';
    ctx.shadowBlur = 4;
    ctx.fillText('⭐', r - 42, 52);
    ctx.restore();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  // Внешнее кольцо
  ctx.beginPath();
  ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Лампочки по кругу
  for (var k = 0; k < 20; k++) {
    var ang = (k / 20) * Math.PI * 2 - Math.PI / 2;
    var bx = cx + Math.cos(ang) * (r - 6);
    var by = cy + Math.sin(ang) * (r - 6);
    ctx.beginPath();
    ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
    var lit = k % 2 === 0;
    ctx.fillStyle = lit ? '#FFE53B' : 'rgba(255,255,255,0.25)';
    if (lit) {
      ctx.shadowColor = '#FFE53B';
      ctx.shadowBlur = 12;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Центр под кнопку
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(10,14,31,0.9)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(45,39,255,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spinWheelTo(segmentIndex) {
  var seg = 360 / SEGMENTS.length;
  var currentMod = ((state.wheelRotation % 360) + 360) % 360;
  var targetMod = ((330 - segmentIndex * seg) % 360 + 360) % 360;
  var delta = ((targetMod - currentMod) % 360 + 360) % 360;
  state.wheelRotation += 360 * 5 + delta;

  var canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = 'rotate(' + state.wheelRotation + 'deg)';
}

// ==========================================================
// PROFILE
// ==========================================================
function loadProfile() {
  if (!user.id) return;
  apiGet('/api/quiz/profile/' + user.id).then(function(data) {
    state.balance = data.balance || 0;
    state.energy = data.energy || 0;
    state.maxEnergy = data.maxEnergy || 10;
    renderProfile();
  }).catch(function(e) { console.error(e); });
}

var prevBalance = 0;
function renderProfile() {
  var balEl = document.getElementById('balance');
  animateCounter(balEl, prevBalance, state.balance);
  prevBalance = state.balance;
  document.getElementById('energy').textContent = state.energy;
  document.getElementById('maxEnergy').textContent = state.maxEnergy;
  var pct = (state.energy / state.maxEnergy) * 100;
  document.getElementById('energyFill').style.width = pct + '%';
  updateShopAffordability();
  updateSpinBtn();
}

function animateCounter(el, from, to) {
  if (from === to) return;
  var duration = 600;
  var start = performance.now();
  function step(now) {
    var t = Math.min(1, (now - start) / duration);
    t = 1 - Math.pow(1 - t, 3);
    var val = Math.round(from + (to - from) * t);
    el.textContent = val;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateSpinBtn() {
  var btn = document.getElementById('spinBtn');
  var info = document.getElementById('spinInfo');
  if (state.spinning) {
    btn.disabled = true;
    info.textContent = '🎰 Крутим...';
    info.className = 'spin-info';
    return;
  }
  if (state.energy < 1) {
    btn.disabled = true;
    info.textContent = '⚡ Нет энергии. Восстановится через 5 мин';
    info.className = 'spin-info warn';
    return;
  }
  btn.disabled = false;
  info.textContent = 'Нажми на кнопку в центре';
  info.className = 'spin-info';
}

// ==========================================================
// SPIN
// ==========================================================
function spin() {
  if (state.spinning) return;
  if (state.energy < 1) {
    showToast('⚡ Нет энергии', 'error');
    haptic('error');
    return;
  }
  state.spinning = true;
  updateSpinBtn();
  haptic('medium');

  apiPost('/api/quiz/spin', { userId: user.id }).then(function(data) {
    var idx = SEGMENTS.findIndex(function(s) { return s.points === data.level; });
    if (idx === -1) idx = 0;
    spinWheelTo(idx);
    state.energy = data.energy;
    state.currentSpin = data;
    renderProfile();
    setTimeout(function() { showQuestion(data); }, 4700);
  }).catch(function(err) {
    state.spinning = false;
    updateSpinBtn();
    showToast(err.error || 'Ошибка', 'error');
    haptic('error');
  });
}

// ==========================================================
// QUESTION
// ==========================================================
function showQuestion(data) {
  document.getElementById('screen-spin').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-question').classList.remove('hidden');

  document.getElementById('questionLevel').textContent = data.level + ' баллов';
  document.getElementById('questionText').textContent = data.question;

  var letters = ['A', 'B', 'C', 'D'];
  var html = '';
  for (var i = 0; i < data.answers.length; i++) {
    html += '<button class="answer" data-idx="' + i + '">' +
      '<span class="letter">' + letters[i] + '</span>' +
      '<span>' + escapeHtml(data.answers[i]) + '</span>' +
      '</button>';
  }
  document.getElementById('answers').innerHTML = html;
  document.querySelectorAll('.answer').forEach(function(b) {
    b.addEventListener('click', function() { answer(parseInt(b.getAttribute('data-idx'))); });
  });
  state.answered = false;
  haptic('light');
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  var btns = document.querySelectorAll('.answer');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });

  apiPost('/api/quiz/answer', {
    userId: user.id,
    token: state.currentSpin.token,
    answer: idx,
  }).then(function(res) {
    if (btns[res.correctAnswer]) btns[res.correctAnswer].classList.add('correct');
    if (!res.correct && btns[idx]) btns[idx].classList.add('wrong');
    state.balance = res.balance;
    renderProfile();
    setTimeout(function() { showResult(res); }, 1400);
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
    backToSpin();
  });
}

function showResult(res) {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  var bar = document.getElementById('resultBar');
  if (res.correct) {
    bar.className = 'card-top-bar win';
    document.getElementById('resultIcon').textContent = '🏆';
    document.getElementById('resultTitle').textContent = 'ПРАВИЛЬНО!';
    document.getElementById('resultTitle').className = 'result-title win';
    document.getElementById('resultSub').textContent = 'Отличный ответ!';
    var p = document.getElementById('resultPoints');
    p.textContent = '+' + res.points + ' ⭐';
    p.className = 'points-box';
    playSound('win');
    haptic('success');
    launchConfetti();
  } else {
    bar.className = 'card-top-bar lose';
    document.getElementById('resultIcon').textContent = '💔';
    document.getElementById('resultTitle').textContent = 'ОШИБКА';
    document.getElementById('resultTitle').className = 'result-title lose';
    document.getElementById('resultSub').textContent = 'Не в этот раз';
    var p2 = document.getElementById('resultPoints');
    p2.textContent = '+0 ⭐';
    p2.className = 'points-box zero';
    playSound('error');
    haptic('error');
  }
}

function backToSpin() {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-spin').classList.remove('hidden');
  state.spinning = false;
  state.answered = false;
  updateSpinBtn();
  loadProfile();
}

// ==========================================================
// CONFETTI
// ==========================================================
function launchConfetti() {
  var c = document.getElementById('confetti');
  var colors = ['#00FF5B', '#00E5FF', '#FFE53B', '#FF0A6C', '#2D27FF', '#FF2525'];
  for (var i = 0; i < 70; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = '-20px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    c.appendChild(piece);
    setTimeout(function(p) { return function() { p.remove(); }; }(piece), 4000);
  }
}

// ==========================================================
// SHOP
// ==========================================================
function loadGifts() {
  apiGet('/api/quiz/gifts').then(function(gifts) {
    state.gifts = gifts;
    renderShop();
  }).catch(function(e) { console.error(e); });
}

function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = '';
  for (var i = 0; i < state.gifts.length; i++) {
    var g = state.gifts[i];
    var affordable = state.balance >= g.price;
    html += '<div class="gift ' + (affordable ? 'affordable' : '') + '" data-gift="' + g.id + '">' +
      '<div class="check">✓</div>' +
      '<span class="em">' + g.emoji + '</span>' +
      '<div class="name">' + escapeHtml(g.name) + '</div>' +
      '<div class="price">⭐ ' + g.price + '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.gift').forEach(function(c) {
    c.addEventListener('click', function() { buyGift(c.getAttribute('data-gift')); });
  });
}

function updateShopAffordability() {
  var cards = document.querySelectorAll('.gift');
  for (var i = 0; i < cards.length; i++) {
    var priceEl = cards[i].querySelector('.price');
    if (!priceEl) continue;
    var price = parseInt(priceEl.textContent.replace(/\D/g, ''));
    if (state.balance >= price) cards[i].classList.add('affordable');
    else cards[i].classList.remove('affordable');
  }
}

function buyGift(giftId) {
  var gift = state.gifts.find(function(g) { return g.id === giftId; });
  if (!gift) return;
  if (state.balance < gift.price) {
    showToast('Недостаточно баллов', 'error');
    haptic('error');
    return;
  }
  if (!confirm('Обменять ' + gift.price + ' ⭐ на ' + gift.emoji + ' ' + gift.name + '?')) return;
  haptic('medium');

  apiPost('/api/quiz/exchange', {
    userId: user.id,
    giftId: giftId,
    firstName: user.first_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    state.balance = res.balance;
    renderProfile();
    haptic('success');
    launchConfetti();
    showModal(gift.emoji, 'Заявка отправлена!', 'Админ подарит тебе подарок в Telegram в течение дня. Он придёт в чат с ботом 🎁');
    loadProfile();
    loadHistory();
  }).catch(function(err) {
    showToast(err.error || 'Ошибка', 'error');
    haptic('error');
  });
}

// ==========================================================
// HISTORY
// ==========================================================
function loadHistory() {
  apiGet('/api/quiz/exchanges/' + user.id).then(function(list) {
    var el = document.getElementById('historyList');
    if (!list || list.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-em">🎁</div><div class="empty-title">Пока пусто</div><div class="empty-sub">Купи подарки в магазине</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var statusText = e.status === 'fulfilled' ? 'Выдано' : 'В обработке';
      html += '<div class="history-item ' + (e.status === 'fulfilled' ? 'fulfilled' : '') + '">' +
        '<div class="bar"></div>' +
        '<div class="history-em">' + e.giftEmoji + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + escapeHtml(e.giftName) + '</div>' +
          '<div class="history-date">' + formatDate(e.date) + '</div>' +
          '<span class="status ' + e.status + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="history-price">⭐ ' + e.price + '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  }).catch(function(e) { console.error(e); });
}

// ==========================================================
// HELPERS
// ==========================================================
function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

function showModal(emoji, title, text) {
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.35);
    });
  } else if (type === 'error') {
    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.22);
    g.gain.setValueAtTime(0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.28);
  }
}

// ==========================================================
// TABS
// ==========================================================
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    var tab = t.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x === t); });
    document.getElementById('view-play').classList.toggle('hidden', tab !== 'play');
    document.getElementById('view-shop').classList.toggle('hidden', tab !== 'shop');
    document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
    haptic('light');
    if (tab === 'shop') renderShop();
    if (tab === 'history') loadHistory();
  });
});

document.getElementById('spinBtn').addEventListener('click', function() {
  initAudio();
  spin();
});

setInterval(loadProfile, 60000);

// INIT
drawWheel();
loadProfile();
loadGifts();
loadHistory();
</script>
