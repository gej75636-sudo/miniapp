<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Фортуна</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg: #0a0a0a;
    --widget: #1c1c1e;
    --widget-2: #2c2c2e;
    --widget-3: #3a3a3c;
    --text: #ffffff;
    --text-2: rgba(235,235,245,0.6);
    --text-3: rgba(235,235,245,0.3);
    --separator: rgba(84,84,88,0.5);
    --blue: #0a84ff;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --accent: #ff453a;
  }

  html, body {
    overscroll-behavior-y: none;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-weight: 400;
    letter-spacing: -0.4px;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
  }

  /* ============== iOS WIDGET BASE ============== */
  .widget {
    background: var(--widget);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    animation: widgetIn .5s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  @keyframes widgetIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .widget:active { transform: scale(0.99); }

  .widget-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .widget-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .widget-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .widget-icon.red    { background: linear-gradient(180deg, #ff6961, #ff453a); }
  .widget-icon.green  { background: linear-gradient(180deg, #4ce06f, #30d158); }
  .widget-icon.blue   { background: linear-gradient(180deg, #3da4ff, #0a84ff); }
  .widget-icon.orange { background: linear-gradient(180deg, #ffb340, #ff9f0a); }
  .widget-icon.gray   { background: var(--widget-3); }

  /* ============== TOP STATUS ROW ============== */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 14px;
  }
  .status-date {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    letter-spacing: -0.1px;
  }
  .status-battery {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--widget);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text-2);
    font-weight: 600;
  }
  .battery-bar {
    width: 22px;
    height: 10px;
    border: 1.5px solid var(--text-2);
    border-radius: 3px;
    position: relative;
    padding: 1.5px;
  }
  .battery-bar::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 4px;
    background: var(--text-2);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    width: 100%;
    height: 100%;
    background: var(--text);
    border-radius: 1px;
  }

  /* ============== HOME TITLE ============== */
  .home-title {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.05;
    padding: 8px 4px 20px;
    color: var(--text);
  }

  /* ============== BIG CLOCK WIDGET (like on photo) ============== */
  .clock-widget {
    background: linear-gradient(180deg, var(--widget) 0%, #0f0f0f 100%);
    border-radius: 28px;
    padding: 22px 24px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    animation: widgetIn .5s cubic-bezier(0.32, 0.72, 0, 1) both;
    animation-delay: 0.05s;
  }
  .clock-widget::before {
    content: '';
    position: absolute;
    top: -60%; right: -30%;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    pointer-events: none;
  }
  .clock-label {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    letter-spacing: 0.2px;
    margin-bottom: 4px;
  }
  .clock-time {
    font-size: 68px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .clock-sub {
    font-size: 14px;
    color: var(--text-2);
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: -0.2px;
  }

  /* ============== STATS GRID (2 widgets like on photo) ============== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .stat-widget {
    background: var(--widget);
    border-radius: 24px;
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
    animation: widgetIn .5s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  .stat-widget:nth-child(1) { animation-delay: 0.1s; }
  .stat-widget:nth-child(2) { animation-delay: 0.15s; }

  .stat-widget-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-2);
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .stat-dot.red { background: var(--red); }
  .stat-dot.green { background: var(--green); }

  .stat-value-big {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1.3px;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat-value-big .unit {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0;
    margin-left: 2px;
  }
  .stat-progress {
    margin-top: 10px;
    height: 4px;
    background: var(--widget-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 4px;
    transition: width .5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ============== WHEEL WIDGET ============== */
  .wheel-widget {
    background: var(--widget);
    border-radius: 28px;
    padding: 24px 16px 20px;
    margin-bottom: 14px;
    text-align: center;
    animation: widgetIn .5s cubic-bezier(0.32, 0.72, 0, 1) both;
    animation-delay: 0.2s;
  }
  .wheel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: 18px;
  }
  .wheel-shell {
    position: relative;
    width: min(280px, 76vw);
    aspect-ratio: 1;
    margin: 0 auto;
  }
  .wheel-shell::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--widget-2);
    z-index: 0;
  }
  .wheel-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #000;
    z-index: 1;
  }
  #wheelCanvas {
    position: absolute;
    inset: 6px;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    border-radius: 50%;
    z-index: 2;
    transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.25, 1);
    will-change: transform;
  }

  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
  }
  .pointer-shape {
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 16px solid var(--accent);
    filter: drop-shadow(0 2px 6px rgba(255,69,58,0.6));
  }

  .spin-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--widget-3);
    border: none;
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-weight: 600;
    transition: transform .15s;
    box-shadow: 0 0 0 4px rgba(0,0,0,0.4);
  }
  .spin-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.92); }
  .spin-btn:disabled {
    color: var(--text-3);
    cursor: not-allowed;
  }
  .spin-btn .em {
    font-size: clamp(20px, 5.5vw, 26px);
    line-height: 1;
  }
  .spin-btn .tx {
    font-size: clamp(8px, 2.1vw, 9px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    opacity: 0.8;
  }

  .wheel-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
    letter-spacing: -0.08px;
    margin-top: 12px;
    font-weight: 500;
  }
  .wheel-hint.warn { color: var(--orange); }
  .wheel-hint.err { color: var(--red); }

  /* ============== QUESTION (as widget) ============== */
  .q-widget {
    background: var(--widget);
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 14px;
    animation: widgetIn .4s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  .q-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--widget-2);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .q-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
  }
  .q-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 18px;
  }
  .answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .answer {
    padding: 15px 16px;
    background: var(--widget-2);
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    line-height: 1.3;
    transition: all .18s;
  }
  .answer:active { transform: scale(0.985); background: var(--widget-3); }
  .answer .letter {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--widget-3);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .answer.correct {
    background: rgba(48,209,88,0.2);
    color: var(--green);
  }
  .answer.correct .letter {
    background: var(--green);
    color: #fff;
  }
  .answer.wrong {
    background: rgba(255,69,58,0.2);
    color: var(--red);
    animation: shake .45s;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .answer.wrong .letter {
    background: var(--red);
    color: #fff;
  }

  /* ============== RESULT ============== */
  .r-widget {
    background: var(--widget);
    border-radius: 24px;
    padding: 36px 22px 22px;
    text-align: center;
    animation: widgetIn .4s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  .r-icon {
    font-size: 68px;
    line-height: 1;
    margin-bottom: 12px;
    display: inline-block;
    animation: pop .6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .r-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.6px;
    margin-bottom: 6px;
  }
  .r-title.win { color: var(--green); }
  .r-title.lose { color: var(--red); }
  .r-sub {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 20px;
    letter-spacing: -0.2px;
  }
  .r-points {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1.2px;
    color: var(--text);
    padding: 12px 24px;
    background: var(--widget-2);
    border-radius: 18px;
    margin-bottom: 22px;
    font-variant-numeric: tabular-nums;
    animation: pop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .r-points .star { font-size: 24px; }
  .r-points.zero { color: var(--text-3); }

  /* ============== BUTTONS ============== */
  .btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.3px;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    color: var(--text);
    background: var(--widget-2);
  }
  .btn:active { transform: scale(0.97); opacity: 0.85; }
  .btn.accent {
    background: var(--accent);
    color: #fff;
  }

  /* ============== SHOP ============== */
  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .gift {
    background: var(--widget);
    border-radius: 24px;
    padding: 22px 12px 18px;
    text-align: center;
    cursor: pointer;
    transition: transform .2s cubic-bezier(0.32, 0.72, 0, 1);
    animation: widgetIn .35s cubic-bezier(0.32, 0.72, 0, 1) both;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .gift:active { transform: scale(0.96); }
  .gift.locked { opacity: 0.35; }
  .gift.unlocked {
    border-color: rgba(255,69,58,0.3);
  }
  .gift.unlocked::before {
    content: '';
    position: absolute;
    top: 10px; right: 10px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .gift-emoji {
    font-size: 48px;
    display: block;
    line-height: 1;
    margin-bottom: 14px;
  }
  .gift-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 10px;
  }
  .gift-price {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    padding: 5px 12px;
    background: var(--widget-2);
    border-radius: 100px;
    font-variant-numeric: tabular-nums;
  }
  .gift.unlocked .gift-price {
    background: rgba(255,69,58,0.2);
    color: #ff6b5c;
  }

  /* ============== HISTORY ============== */
  .hist-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .hist {
    background: var(--widget);
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: widgetIn .35s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  .hist-em {
    font-size: 32px;
    line-height: 1;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    background: var(--widget-2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hist-info { flex: 1; min-width: 0; }
  .hist-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hist-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
    flex-wrap: wrap;
  }
  .hist-status {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .hist-status.pending { background: rgba(255,159,10,0.2); color: var(--orange); }
  .hist-status.fulfilled { background: rgba(48,209,88,0.2); color: var(--green); }
  .hist-price {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* ============== EMPTY ============== */
  .empty {
    text-align: center;
    padding: 60px 24px;
  }
  .empty-icon {
    font-size: 56px;
    opacity: 0.2;
    margin-bottom: 16px;
    display: inline-block;
  }
  .empty-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .empty-sub {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.4;
  }

  /* ============== iOS DOCK (bottom) ============== */
  .dock {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: max(16px, env(safe-area-inset-bottom));
    padding: 10px;
    background: rgba(44,44,46,0.75);
    backdrop-filter: saturate(180%) blur(30px);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-radius: 28px;
    display: flex;
    gap: 8px;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .dock-btn {
    flex: 1;
    height: 56px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    transition: all .25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .dock-btn.active {
    background: var(--widget-3);
    color: var(--text);
  }
  .dock-btn .em {
    font-size: 20px;
    line-height: 1;
  }

  /* ============== SHEET ============== */
  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s, visibility .3s;
  }
  .sheet-bg.show { opacity: 1; visibility: visible; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 501;
    background: var(--widget);
    border-radius: 28px 28px 0 0;
    padding: 8px 0 calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .5s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-grab {
    width: 36px; height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.15);
    margin: 6px auto 20px;
  }
  .sheet-em {
    text-align: center;
    font-size: 60px;
    line-height: 1;
    margin-bottom: 12px;
    animation: pop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .sheet-title {
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    padding: 0 24px;
  }
  .sheet-text {
    text-align: center;
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.5;
    padding: 0 32px;
    margin-bottom: 22px;
  }
  .sheet-actions { padding: 0 16px; }

  /* ============== TOAST ============== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom));
    padding: 12px 22px;
    border-radius: 100px;
    background: rgba(44,44,46,0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.15px;
    z-index: 9999;
    max-width: 88%;
    text-align: center;
    opacity: 0;
    transform: translate(-50%, 12px) scale(0.94);
    transition: opacity .3s, transform .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    visibility: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
    visibility: visible;
  }
  .toast.success { background: rgba(48,209,88,0.96); }
  .toast.error { background: rgba(255,69,58,0.96); }

  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    overflow: hidden;
  }
  .cf {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: cfFall 2.6s linear forwards;
  }
  @keyframes cfFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

    <button class="btn accent" id="sheetBtn">ОК</button>
  </div>

<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>

<script>
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';

var tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch(e) {}
try {
  tg.setHeaderColor('#0a0a0a');
  tg.setBackgroundColor('#0a0a0a');
} catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Гость' };

function haptic(t) {
  try {
    if (t === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (t === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (t === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (t === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch(e) {}
}

var state = {
  balance: 0, energy: 10, maxEnergy: 10, gifts: [],
  currentSpin: null, spinning: false, wheelRotation: 0, answered: false,
};

var SEGMENTS = [
  { points: 10,  c1: '#4a4a4c', c2: '#2c2c2e', text: '10'  },
  { points: 20,  c1: '#5a5a5c', c2: '#3a3a3c', text: '20'  },
  { points: 30,  c1: '#3a3a3c', c2: '#1c1c1e', text: '30'  },
  { points: 50,  c1: '#ff9f0a', c2: '#b36d00', text: '50'  },
  { points: 100, c1: '#ff453a', c2: '#b0241e', text: '100' },
  { points: 250, c1: '#ffd60a', c2: '#b39000', text: '250' },
];

function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Cache-Control', 'no-cache');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('Bad JSON')); }
        } else {
          try { reject(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('HTTP ' + xhr.status)); }
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}
function apiGet(p) { return apiRequest('GET', p + '?_=' + Date.now()); }
function apiPost(p, b) { return apiRequest('POST', p, b); }

function updateDate() {
  var d = new Date();
  var days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  var months = ['Янв', 'Фев', 'Мар', 'Апр', 'Мая', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
  document.getElementById('dateText').textContent = days[d.getDay()] + ' ' + d.getDate() + ' · ' + months[d.getMonth()];
}

function drawWheel() {
  var c = document.getElementById('wheelCanvas');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var cx = W / 2, cy = H / 2;
  var r = Math.min(W, H) / 2 - 12;
  var seg = (Math.PI * 2) / SEGMENTS.length;

  ctx.clearRect(0, 0, W, H);

  for (var i = 0; i < SEGMENTS.length; i++) {
    var startAngle = i * seg - Math.PI / 2;
    var endAngle = startAngle + seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();

    var grad = ctx.createRadialGradient(cx, cy, 40, cx, cy, r);
    grad.addColorStop(0, SEGMENTS[i].c1);
    grad.addColorStop(1, SEGMENTS[i].c2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 58px -apple-system, "SF Pro Display", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.fillText(SEGMENTS[i].text, r - 40, 0);
    ctx.font = '400 24px sans-serif';
    ctx.fillText('⭐', r - 40, 46);
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = '#2c2c2e';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spinWheelTo(idx) {
  var seg = 360 / SEGMENTS.length;
  var cur = ((state.wheelRotation % 360) + 360) % 360;
  var tgt = ((330 - idx * seg) % 360 + 360) % 360;
  var delta = ((tgt - cur) % 360 + 360) % 360;
  state.wheelRotation += 360 * 5 + delta;
  document.getElementById('wheelCanvas').style.transform = 'rotate(' + state.wheelRotation + 'deg)';
}

function loadProfile() {
  if (!user.id) return;
  apiGet('/api/quiz/profile/' + user.id).then(function(d) {
    state.balance = d.balance || 0;
    state.energy = d.energy || 0;
    state.maxEnergy = d.maxEnergy || 10;
    renderProfile();
  }).catch(function(e) { console.error(e); });
}

var prevB = 0;
function renderProfile() {
  var b = document.getElementById('balance');
  animateCounter(b, prevB, state.balance);
  prevB = state.balance;
  document.getElementById('energy').textContent = state.energy;
  document.getElementById('maxEnergy').textContent = state.maxEnergy;
  document.getElementById('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
  document.getElementById('clockTime').textContent = state.balance.toLocaleString('ru-RU');
  updateShopAffordability();
  updateSpinBtn();
}

function animateCounter(el, from, to) {
  if (from === to) { el.textContent = to.toLocaleString('ru-RU'); return; }
  var dur = 500, start = performance.now();
  function step(now) {
    var t = Math.min(1, (now - start) / dur);
    t = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (to - from) * t).toLocaleString('ru-RU');
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateSpinBtn() {
  var btn = document.getElementById('spinBtn');
  var info = document.getElementById('spinHint');
  if (state.spinning) {
    btn.disabled = true; info.textContent = 'Крутим...'; info.className = 'wheel-hint'; return;
  }
  if (state.energy < 1) {
    btn.disabled = true; info.textContent = 'Нет энергии · восстановится через 5 мин'; info.className = 'wheel-hint warn'; return;
  }
  btn.disabled = false; info.textContent = 'Нажми, чтобы крутить'; info.className = 'wheel-hint';
}

function spin() {
  if (state.spinning) return;
  if (state.energy < 1) { showToast('Нет энергии', 'error'); haptic('error'); return; }
  state.spinning = true; updateSpinBtn(); haptic('medium');

  apiPost('/api/quiz/spin', { userId: user.id }).then(function(d) {
    var idx = SEGMENTS.findIndex(function(s) { return s.points === d.level; });
    if (idx === -1) idx = 0;
    spinWheelTo(idx);
    state.energy = d.energy; state.currentSpin = d; renderProfile();
    setTimeout(function() { showQuestion(d); }, 4700);
  }).catch(function(err) {
    state.spinning = false; updateSpinBtn();
    showToast(err.error || 'Ошибка', 'error'); haptic('error');
  });
}

function showQuestion(d) {
  document.getElementById('screen-spin').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-question').classList.remove('hidden');
  document.getElementById('questionLevel').textContent = d.level + ' баллов';
  document.getElementById('questionText').textContent = d.question;

  var letters = ['А', 'Б', 'В', 'Г'];
  var html = '';
  for (var i = 0; i < d.answers.length; i++) {
    html += '<button class="answer" data-idx="' + i + '">' +
      '<span class="letter">' + letters[i] + '</span>' +
      '<span>' + escapeHtml(d.answers[i]) + '</span></button>';
  }
  document.getElementById('answers').innerHTML = html;
  document.querySelectorAll('.answer').forEach(function(b) {
    b.addEventListener('click', function() { answer(parseInt(b.getAttribute('data-idx'))); });
  });
  state.answered = false; haptic('light');
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  var btns = document.querySelectorAll('.answer');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });

  apiPost('/api/quiz/answer', {
    userId: user.id, token: state.currentSpin.token, answer: idx,
  }).then(function(res) {
    if (btns[res.correctAnswer]) btns[res.correctAnswer].classList.add('correct');
    if (!res.correct && btns[idx]) btns[idx].classList.add('wrong');
    state.balance = res.balance; renderProfile();
    setTimeout(function() { showResult(res); }, 1400);
  }).catch(function(err) { showToast(err.error || 'Ошибка', 'error'); backToSpin(); });
}

function showResult(res) {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  if (res.correct) {
    document.getElementById('resultIcon').textContent = '🎉';
    document.getElementById('resultTitle').textContent = 'Верно';
    document.getElementById('resultTitle').className = 'r-title win';
    document.getElementById('resultSub').textContent = 'Хороший ответ';
    var p = document.getElementById('resultPoints');
    p.innerHTML = '<span>+' + res.points + '</span><span class="star">⭐</span>';
    p.className = 'r-points';
    playSound('win'); haptic('success'); launchConfetti();
  } else {
    document.getElementById('resultIcon').textContent = '😕';
    document.getElementById('resultTitle').textContent = 'Неверно';
    document.getElementById('resultTitle').className = 'r-title lose';
    document.getElementById('resultSub').textContent = 'Повезёт в следующий раз';
    var p2 = document.getElementById('resultPoints');
    p2.innerHTML = '<span>+0</span><span class="star">⭐</span>';
    p2.className = 'r-points zero';
    playSound('error'); haptic('error');
  }
}

function backToSpin() {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-spin').classList.remove('hidden');
  state.spinning = false; state.answered = false; updateSpinBtn(); loadProfile();
}

function launchConfetti() {
  var c = document.getElementById('confetti');
  var colors = ['#ff453a', '#30d158', '#0a84ff', '#bf5af2', '#ff9f0a', '#ffd60a'];
  for (var i = 0; i < 70; i++) {
    var p = document.createElement('div');
    p.className = 'cf';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = '-20px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    if (Math.random() > 0.5) p.style.borderRadius = '50%';
    c.appendChild(p);
    setTimeout(function(x) { return function() { x.remove(); }; }(p), 4200);
  }
}

function loadGifts() {
  apiGet('/api/quiz/gifts').then(function(g) { state.gifts = g; renderShop(); });
}

function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = '';
  for (var i = 0; i < state.gifts.length; i++) {
    var g = state.gifts[i];
    var unlocked = state.balance >= g.price;
    html += '<div class="gift ' + (unlocked ? 'unlocked' : 'locked') + '" data-gift="' + g.id + '" style="animation-delay:' + (i * 0.03) + 's">' +
      '<span class="gift-emoji">' + g.emoji + '</span>' +
      '<div class="gift-name">' + escapeHtml(g.name) + '</div>' +
      '<div class="gift-price">⭐ ' + g.price + '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.gift').forEach(function(c) {
    c.addEventListener('click', function() { buyGift(c.getAttribute('data-gift')); });
  });
}

function updateShopAffordability() {
  var cards = document.querySelectorAll('.gift');
  for (var i = 0; i < cards.length; i++) {
    var pe = cards[i].querySelector('.gift-price');
    if (!pe) continue;
    var p = parseInt(pe.textContent.replace(/\D/g, ''));
    if (state.balance >= p) {
      cards[i].classList.add('unlocked');
      cards[i].classList.remove('locked');
    } else {
      cards[i].classList.remove('unlocked');
      cards[i].classList.add('locked');
    }
  }
}

function buyGift(id) {
  var g = state.gifts.find(function(x) { return x.id === id; });
  if (!g) return;
  if (state.balance < g.price) { showToast('Недостаточно баллов', 'error'); haptic('error'); return; }
  if (!confirm('Обменять ' + g.price + ' ⭐ на ' + g.emoji + ' ' + g.name + '?')) return;
  haptic('medium');
  apiPost('/api/quiz/exchange', {
    userId: user.id, giftId: id,
    firstName: user.first_name || '', username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    state.balance = res.balance; renderProfile();
    haptic('success'); launchConfetti();
    showSheet(g.emoji, 'Заявка отправлена', 'Админ отправит подарок в Telegram в ближайшее время', 'ОК');
    loadProfile(); loadHistory();
  }).catch(function(e) { showToast(e.error || 'Ошибка', 'error'); haptic('error'); });
}

function loadHistory() {
  apiGet('/api/quiz/exchanges/' + user.id).then(function(list) {
    var el = document.getElementById('historyList');
    if (!list || list.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🎁</div><div class="empty-title">Пока ничего нет</div><div class="empty-sub">Купи подарки во вкладке Магазин</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var f = e.status === 'fulfilled';
      html += '<div class="hist" style="animation-delay:' + (i * 0.03) + 's">' +
        '<div class="hist-em">' + e.giftEmoji + '</div>' +
        '<div class="hist-info">' +
          '<div class="hist-name">' + escapeHtml(e.giftName) + '</div>' +
          '<div class="hist-meta">' +
            '<span>' + formatDate(e.date) + '</span>' +
            '<span class="hist-status ' + (f ? 'fulfilled' : 'pending') + '">' + (f ? 'Выдано' : 'В обработке') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="hist-price">⭐ ' + e.price + '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  });
}

function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast';
  if (type) t.classList.add(type);
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

function showSheet(em, title, text, btn) {
  document.getElementById('sheetEm').textContent = em;
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetText').textContent = text;
  document.getElementById('sheetBtn').textContent = btn || 'ОК';
  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  haptic('light');
}
function closeSheet() {
  document.getElementById('sheetBg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
document.getElementById('sheetBtn').addEventListener('click', closeSheet);
document.getElementById('sheetBg').addEventListener('click', closeSheet);

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
      var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.35);
    });
  } else if (type === 'error') {
    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.22);
    g.gain.setValueAtTime(0.07, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.28);
  }
}

function switchTab(tab) {
  document.querySelectorAll('.dock-btn').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-tab') === tab);
  });
  document.getElementById('view-play').classList.toggle('hidden', tab !== 'play');
  document.getElementById('view-shop').classList.toggle('hidden', tab !== 'shop');
  document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');

  var data = {
    play:    { t: 'Фортуна',  s: 'Крути колесо — копи баллы' },
    shop:    { t: 'Магазин',  s: 'Меняй баллы на подарки' },
    history: { t: 'Подарки',  s: 'Твои заказы' },
  };
  document.getElementById('homeTitle').textContent = data[tab].t;
  document.getElementById('clockSub').textContent = data[tab].s;
  document.getElementById('clockLabel').textContent = data[tab].t + ' · сейчас';

  haptic('light');
  if (tab === 'shop') renderShop();
  if (tab === 'history') loadHistory();
}

document.querySelectorAll('.dock-btn').forEach(function(t) {
  t.addEventListener('click', function() { switchTab(t.getAttribute('data-tab')); });
});

document.getElementById('spinBtn').addEventListener('click', function() {
  initAudio(); spin();
});

setInterval(loadProfile, 60000);

updateDate();
drawWheel();
loadProfile();
loadGifts();
loadHistory();
</script>
</body>
</html>
