<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fortune Wheel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg: #06060c;
    --bg2: #0d0d17;
    --surface: rgba(255,255,255,0.03);
    --surface-hi: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.15);
    --gold: #e8c268;
    --gold-bright: #f6d78a;
    --gold-deep: #b8901f;
    --text: #ffffff;
    --text-2: rgba(255,255,255,0.65);
    --text-3: rgba(255,255,255,0.35);
    --green: #4ade80;
    --red: #f87171;
    --violet: #a78bfa;
    --pink: #f472b6;
  }

  html, body { overscroll-behavior-y: none; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 30px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    font-weight: 500;
  }

  /* ==== Ambient background ==== */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
    animation: orbFloat 18s ease-in-out infinite;
  }
  .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(232,194,104,0.35), transparent 70%); top: -180px; left: -180px; }
  .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(167,139,250,0.3), transparent 70%); bottom: -150px; right: -150px; animation-delay: -6s; }
  .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(244,114,182,0.2), transparent 70%); top: 45%; left: 30%; animation-delay: -12s; opacity: 0.3; }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 40px) scale(0.95); }
  }

  /* Subtle grid pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black, transparent 80%);
  }

  /* ==== Topbar ==== */
  .topbar {
    position: sticky;
    top: 0;
    padding: 18px 20px;
    padding-top: max(18px, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    background: rgba(6,6,12,0.75);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, #e8c268, #b8901f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow:
      0 4px 20px rgba(232,194,104,0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative;
  }
  .brand-icon::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(135deg, #f6d78a, transparent, #b8901f);
    z-index: -1;
    filter: blur(4px);
    opacity: 0.6;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #f6d78a, #e8c268);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-sub {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-3);
    text-transform: uppercase;
  }

  .status-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.25);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: var(--green);
    text-transform: uppercase;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulseDot 1.5s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .main { position: relative; z-index: 2; padding: 18px 16px 0; }

  /* ==== Balance / Energy cards ==== */
  .wealth {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 22px;
  }
  .wealth-card {
    position: relative;
    padding: 18px 18px 16px;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .wealth-card::before {
    content: '';
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(232,194,104,0.4), rgba(232,194,104,0.05) 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .wealth-card.gold {
    background: linear-gradient(135deg, rgba(232,194,104,0.12), rgba(184,144,31,0.03));
  }
  .wealth-card.violet::before {
    background: linear-gradient(135deg, rgba(167,139,250,0.4), rgba(167,139,250,0.05) 60%);
  }
  .wealth-card.violet {
    background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(167,139,250,0.02));
  }
  .wealth-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wealth-label .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }
  .wealth-card.gold .wealth-label { color: var(--gold); }
  .wealth-card.violet .wealth-label { color: var(--violet); }
  .wealth-value {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1.2px;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  .wealth-value .unit {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: 0;
  }
  .wealth-card.gold .wealth-value .num {
    background: linear-gradient(135deg, #f6d78a, #e8c268);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(232,194,104,0.35));
  }
  .wealth-card.violet .wealth-value .num {
    color: #c4b5fd;
  }
  .wealth-bar {
    height: 4px;
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
    position: relative;
  }
  .wealth-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #a78bfa, #7c3aed);
    border-radius: 4px;
    transition: width .6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(167,139,250,0.7);
    position: relative;
  }
  .wealth-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: barShimmer 2.5s ease-in-out infinite;
  }
  @keyframes barShimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ==== Tabs ==== */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 5px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 18px;
    margin-bottom: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-3);
    cursor: pointer;
    transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(232,194,104,0.2), rgba(232,194,104,0.08));
    color: var(--gold-bright);
    border: 1px solid rgba(232,194,104,0.35);
    box-shadow: 0 4px 20px rgba(232,194,104,0.2);
  }

  /* ==== WHEEL ==== */
  .wheel-stage {
    display: flex;
    justify-content: center;
    padding: 26px 0 20px;
    position: relative;
  }
  .wheel-shell {
    position: relative;
    width: min(320px, 84vw);
    aspect-ratio: 1;
  }

  /* Glow */
  .wheel-shell::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(232,194,104,0.6),
      rgba(167,139,250,0.4),
      rgba(244,114,182,0.3),
      rgba(232,194,104,0.6));
    filter: blur(30px);
    animation: spinGlow 8s linear infinite;
    opacity: 0.7;
    z-index: 0;
  }
  @keyframes spinGlow {
    to { transform: rotate(360deg); }
  }

  /* Ring */
  .wheel-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #b8901f, #e8c268, #f6d78a, #e8c268, #b8901f, #8a6a15, #b8901f);
    animation: ringSpin 6s linear infinite;
    z-index: 1;
    box-shadow:
      0 0 40px rgba(232,194,104,0.5),
      inset 0 0 20px rgba(0,0,0,0.3);
  }
  @keyframes ringSpin {
    to { transform: rotate(360deg); }
  }

  .wheel-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #131220 0%, #06060c 70%);
    z-index: 2;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
  }

  #wheelCanvas {
    position: absolute;
    inset: 10px;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    border-radius: 50%;
    z-index: 3;
    transition: transform 4.6s cubic-bezier(0.15, 0.9, 0.35, 1);
    will-change: transform;
    filter: drop-shadow(0 0 20px rgba(232,194,104,0.3));
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 6px 16px rgba(232,194,104,0.9));
    animation: pointerBob 1.4s ease-in-out infinite;
  }
  @keyframes pointerBob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }
  .pointer-gem {
    width: 12px;
    height: 12px;
    background: radial-gradient(circle, #f6d78a, #b8901f);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(232,194,104,0.9);
  }
  .pointer-tri {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 22px solid #e8c268;
    margin-top: -2px;
  }

  /* Center spin button */
  .spin-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 36%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #f6d78a 0%, #e8c268 40%, #b8901f 75%, #6b510e 100%);
    border: 3px solid rgba(255,255,255,0.35);
    color: #1a1204;
    cursor: pointer;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    overflow: hidden;
    transition: transform .15s;
    box-shadow:
      0 12px 40px rgba(232,194,104,0.6),
      0 0 0 8px rgba(232,194,104,0.12),
      inset 0 -6px 16px rgba(0,0,0,0.35),
      inset 0 4px 12px rgba(255,255,255,0.5);
  }
  .spin-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(255,255,255,0.6) 20deg,
      transparent 40deg,
      transparent 360deg);
    animation: btnShine 3s linear infinite;
    pointer-events: none;
  }
  @keyframes btnShine {
    to { transform: rotate(360deg); }
  }
  .spin-btn:active:not(:disabled) {
    transform: translate(-50%, -50%) scale(0.92);
  }
  .spin-btn:disabled {
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #1a1a1a 60%);
    color: rgba(255,255,255,0.35);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    cursor: not-allowed;
    opacity: 0.7;
  }
  .spin-btn:disabled::before { display: none; }
  .spin-btn .em {
    font-size: clamp(22px, 6.5vw, 30px);
    line-height: 1;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  .spin-btn .tx {
    font-size: clamp(8px, 2.3vw, 10px);
    position: relative;
    z-index: 1;
    letter-spacing: 1.2px;
  }

  .spin-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text-3);
    font-weight: 700;
    margin-top: 18px;
    letter-spacing: -0.1px;
  }
  .spin-hint.warn { color: var(--gold); }
  .spin-hint.err { color: var(--red); }

  /* ==== Panel (glass card) ==== */
  .panel {
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border-radius: 24px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: panelIn .45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .panel-top-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #e8c268, transparent);
  }

  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(232,194,104,0.18), rgba(232,194,104,0.08));
    border: 1px solid rgba(232,194,104,0.4);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 900;
    color: var(--gold-bright);
    margin-bottom: 18px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(232,194,104,0.15);
  }
  .level-badge .spark {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 10px var(--gold-bright);
    animation: pulseDot 1.4s ease-in-out infinite;
  }

  .question-text {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.4;
    letter-spacing: -0.3px;
    margin-bottom: 22px;
    color: #fff;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    padding: 16px 18px;
    background: rgba(255,255,255,0.035);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 14px;
    line-height: 1.4;
    position: relative;
  }
  .answer::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, rgba(232,194,104,0.06), transparent);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .answer:active {
    transform: scale(0.98);
    border-color: rgba(232,194,104,0.4);
  }
  .answer .letter {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(232,194,104,0.2), rgba(232,194,104,0.05));
    border: 1px solid rgba(232,194,104,0.3);
    color: var(--gold-bright);
    font-weight: 900;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .25s;
  }
  .answer.correct {
    background: linear-gradient(135deg, rgba(74,222,128,0.18), rgba(74,222,128,0.05));
    border-color: var(--green);
    color: #86efac;
    box-shadow: 0 0 30px rgba(74,222,128,0.25);
  }
  .answer.correct .letter {
    background: linear-gradient(135deg, rgba(74,222,128,0.4), rgba(74,222,128,0.2));
    border-color: var(--green);
    color: #fff;
  }
  .answer.wrong {
    background: linear-gradient(135deg, rgba(248,113,113,0.18), rgba(248,113,113,0.05));
    border-color: var(--red);
    color: #fca5a5;
    animation: shake .4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .answer.wrong .letter {
    background: linear-gradient(135deg, rgba(248,113,113,0.4), rgba(248,113,113,0.2));
    border-color: var(--red);
    color: #fff;
  }

  /* ==== Result ==== */
  .result-panel {
    text-align: center;
    padding: 40px 24px 32px;
  }
  .result-icon {
    font-size: 84px;
    line-height: 1;
    margin-bottom: 16px;
    display: inline-block;
    animation: resultBounce .7s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 8px 30px rgba(232,194,104,0.5));
  }
  @keyframes resultBounce {
    0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(4deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .result-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.8px;
    margin-bottom: 10px;
  }
  .result-title.win {
    background: linear-gradient(135deg, #f6d78a, #e8c268);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(232,194,104,0.4));
  }
  .result-title.lose { color: var(--red); }
  .result-sub {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 24px;
    font-weight: 600;
  }
  .points-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -1.5px;
    padding: 14px 30px;
    background: linear-gradient(135deg, rgba(232,194,104,0.15), rgba(232,194,104,0.05));
    border: 2px solid rgba(232,194,104,0.4);
    border-radius: 20px;
    margin-bottom: 26px;
    position: relative;
    animation: pointsPop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pointsPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .points-badge .num {
    background: linear-gradient(135deg, #f6d78a, #e8c268);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .points-badge .star { font-size: 30px; }
  .points-badge::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: linear-gradient(135deg, #e8c268, transparent, #e8c268);
    filter: blur(10px);
    opacity: 0.5;
    z-index: -1;
    animation: shine 2.5s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }
  .points-badge.zero {
    background: rgba(255,255,255,0.04);
    border-color: var(--border);
  }
  .points-badge.zero .num { color: var(--text-3); -webkit-text-fill-color: var(--text-3); }
  .points-badge.zero::before { display: none; }

  /* ==== Buttons ==== */
  .btn {
    padding: 17px 26px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.3px;
    color: #1a1204;
    width: 100%;
    margin-bottom: 10px;
    transition: transform .15s;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
  }
  .btn:active { transform: scale(0.97); }
  .btn-gold {
    background: linear-gradient(135deg, #f6d78a 0%, #e8c268 50%, #b8901f 100%);
    box-shadow: 0 12px 32px rgba(232,194,104,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn-gold::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: translateX(-100%);
    animation: btnShineBig 3s ease-in-out infinite;
  }
  @keyframes btnShineBig {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .btn-ghost {
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: 1px solid var(--border-hi);
  }

  /* ==== Section title ==== */
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-left: 2px;
  }
  .section-head::before {
    content: '';
    width: 24px;
    height: 2px;
    background: linear-gradient(90deg, #e8c268, transparent);
    border-radius: 2px;
  }

  /* ==== Shop ==== */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .gift-card {
    position: relative;
    padding: 22px 14px 18px;
    border-radius: 22px;
    text-align: center;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1.5px solid var(--border);
    transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: panelIn .4s ease both;
  }
  .gift-card:nth-child(1) { animation-delay: 0.03s; }
  .gift-card:nth-child(2) { animation-delay: 0.06s; }
  .gift-card:nth-child(3) { animation-delay: 0.09s; }
  .gift-card:nth-child(4) { animation-delay: 0.12s; }
  .gift-card:nth-child(5) { animation-delay: 0.15s; }
  .gift-card:nth-child(6) { animation-delay: 0.18s; }
  .gift-card:nth-child(7) { animation-delay: 0.21s; }
  .gift-card:nth-child(8) { animation-delay: 0.24s; }
  .gift-card:nth-child(9) { animation-delay: 0.27s; }
  .gift-card:active { transform: scale(0.96); }
  .gift-card.affordable {
    border-color: rgba(232,194,104,0.5);
    background: linear-gradient(135deg, rgba(232,194,104,0.12), rgba(232,194,104,0.03));
    box-shadow:
      0 10px 30px rgba(232,194,104,0.15),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .gift-card.affordable::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e8c268, transparent);
    animation: lineShine 2s ease-in-out infinite;
  }
  @keyframes lineShine {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }
  .gift-emoji {
    font-size: 52px;
    display: block;
    line-height: 1;
    margin-bottom: 12px;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
    transition: transform .3s;
  }
  .gift-card:active .gift-emoji { transform: scale(1.12) rotate(-4deg); }
  .gift-name {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.2px;
    margin-bottom: 10px;
    color: var(--text);
  }
  .gift-price {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 900;
    color: var(--text-2);
    padding: 5px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 100px;
    transition: all .3s;
  }
  .gift-card.affordable .gift-price {
    color: var(--gold-bright);
    background: rgba(232,194,104,0.15);
    border-color: rgba(232,194,104,0.4);
    box-shadow: 0 0 16px rgba(232,194,104,0.25);
  }
  .gift-check {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f6d78a, #b8901f);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #1a1204;
    font-weight: 900;
    box-shadow: 0 4px 12px rgba(232,194,104,0.5);
  }
  .gift-card.affordable .gift-check { display: flex; }

  /* ==== History ==== */
  .history-card {
    position: relative;
    padding: 16px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

  }
  .history-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #e8c268, #b8901f);

  .history-card.fulfilled::before {
    background: linear-gradient(180deg, #4ade80, #16a34a);
  }
  .history-emoji {
    font-size: 34px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
  }
  .history-date {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 600;
  }
  .history-status {
    display: inline-flex;
    align-items: center;

    font-size: 9px;

    text-transform: uppercase;

  .history-status.pending {

  .history-status.fulfilled {

    border: 1px solid rgba(74,222,128,0.3);
  }
  .history-price {
    font-size: 15px;
    font-weight: 900;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;

  /* ==== Empty ==== */
  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-3);
  }
  .empty-icon {
    font-size: 76px;
    margin-bottom: 18px;
    opacity: 0.5;
    display: inline-block;
    animation: floatY 3.5s ease-in-out infinite;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }
  .empty-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  .empty-sub { font-size: 13px; line-height: 1.5; }

  /* ==== Toast ==== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    padding: 15px 24px;
    border-radius: 16px;
    background: rgba(15,15,25,0.95);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    z-index: 9999;
    max-width: 88%;
    text-align: center;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.1);
    opacity: 0;
    transform: translate(-50%, 30px);
    transition: opacity .3s, transform .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    visibility: hidden;
    letter-spacing: -0.2px;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
    visibility: visible;
  }
  .toast.success {
    background: linear-gradient(135deg, rgba(74,222,128,0.95), rgba(22,163,74,0.95));
    box-shadow: 0 20px 60px rgba(74,222,128,0.4), 0 0 0 1px rgba(74,222,128,0.6);
    color: #0a2818;
  }
  .toast.error {
    background: linear-gradient(135deg, rgba(248,113,113,0.95), rgba(185,28,28,0.95));
    box-shadow: 0 20px 60px rgba(248,113,113,0.4), 0 0 0 1px rgba(248,113,113,0.6);
  }

  /* ==== Modal ==== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: linear-gradient(135deg, #131220 0%, #0a0912 100%);
    border-radius: 28px;
    padding: 34px 26px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(232,194,104,0.25);
    animation: popIn .5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 30px 100px rgba(0,0,0,0.8),
      0 0 80px rgba(232,194,104,0.15),
      inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .modal-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #e8c268, transparent);
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-emoji {
    font-size: 72px;
    margin-bottom: 16px;
    display: inline-block;
    animation: resultBounce .7s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 8px 30px rgba(232,194,104,0.5));
  }
  .modal-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: -0.4px;
    background: linear-gradient(135deg, #f6d78a, #e8c268);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal-text {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.55;
    margin-bottom: 24px;
    font-weight: 500;
  }

  /* ==== Confetti ==== */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall 2.6s linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none !important; }
</style>
</head>

<script>
var API_URL = 'https://summer-sound-ec0f.gej75636.workers.dev';

var tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch(e) {}
try { tg.setHeaderColor('#06060c'); } catch(e) {}
try { tg.setBackgroundColor('#06060c'); } catch(e) {}

var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 0, first_name: 'Guest' };

function haptic(type) {
  try {
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch(e) {}
}

var state = {
  balance: 0,
  energy: 10,
  maxEnergy: 10,
  gifts: [],
  currentSpin: null,
  spinning: false,
  wheelRotation: 0,
  answered: false,
};

var SEGMENTS = [
  { points: 10,  c1: '#4ade80', c2: '#166534', text: '10'  },
  { points: 20,  c1: '#60a5fa', c2: '#1e40af', text: '20'  },
  { points: 30,  c1: '#a78bfa', c2: '#5b21b6', text: '30'  },
  { points: 50,  c1: '#fbbf24', c2: '#b45309', text: '50'  },
  { points: 100, c1: '#f472b6', c2: '#831843', text: '100' },
  { points: 250, c1: '#f6d78a', c2: '#8a6a15', text: '250' },
];

function apiRequest(method, path, body) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_URL + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Cache-Control', 'no-cache');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('Bad JSON')); }
        } else {
          try { reject(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('HTTP ' + xhr.status)); }
        }
      }
    };
    xhr.onerror = function() { reject(new Error('Network error')); };
    xhr.send(body ? JSON.stringify(body) : null);
  });
}
function apiGet(p) { return apiRequest('GET', p + '?_=' + Date.now()); }
function apiPost(p, b) { return apiRequest('POST', p, b); }

function drawWheel() {
  var c = document.getElementById('wheelCanvas');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var cx = W / 2, cy = H / 2;
  var r = Math.min(W, H) / 2 - 12;
  var seg = (Math.PI * 2) / SEGMENTS.length;

  ctx.clearRect(0, 0, W, H);

  for (var i = 0; i < SEGMENTS.length; i++) {
    var startAngle = i * seg - Math.PI / 2;
    var endAngle = startAngle + seg;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();

    var grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, r);
    grad.addColorStop(0, SEGMENTS[i].c1);
    grad.addColorStop(1, SEGMENTS[i].c2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#fff';
    ctx.font = '900 68px Inter, -apple-system, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillText(SEGMENTS[i].text, r - 42, 0);

    ctx.font = '400 34px sans-serif';
    ctx.shadowBlur = 6;
    ctx.fillText('⭐', r - 42, 54);
    ctx.restore();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  // outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,194,104,0.4)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // bulbs
  for (var k = 0; k < 20; k++) {
    var ang = (k / 20) * Math.PI * 2 - Math.PI / 2;
    var bx = cx + Math.cos(ang) * (r - 6);
    var by = cy + Math.sin(ang) * (r - 6);
    ctx.beginPath();
    ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
    var lit = k % 2 === 0;
    ctx.fillStyle = lit ? '#f6d78a' : 'rgba(255,255,255,0.2)';
    if (lit) {
      ctx.shadowColor = '#f6d78a';
      ctx.shadowBlur = 14;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(6,6,12,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,194,104,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spinWheelTo(segmentIndex) {
  var seg = 360 / SEGMENTS.length;
  var currentMod = ((state.wheelRotation % 360) + 360) % 360;
  var targetMod = ((330 - segmentIndex * seg) % 360 + 360) % 360;
  var delta = ((targetMod - currentMod) % 360 + 360) % 360;
  state.wheelRotation += 360 * 5 + delta;
  var canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = 'rotate(' + state.wheelRotation + 'deg)';
}

function loadProfile() {
  if (!user.id) return;
  apiGet('/api/quiz/profile/' + user.id).then(function(data) {
    state.balance = data.balance || 0;
    state.energy = data.energy || 0;
    state.maxEnergy = data.maxEnergy || 10;
    renderProfile();
  }).catch(function(e) { console.error(e); });
}

var prevBalance = 0;
function renderProfile() {
  var balEl = document.getElementById('balance');
  animateCounter(balEl, prevBalance, state.balance);
  prevBalance = state.balance;
  document.getElementById('energy').textContent = state.energy;
  document.getElementById('maxEnergy').textContent = state.maxEnergy;
  var pct = (state.energy / state.maxEnergy) * 100;
  document.getElementById('energyFill').style.width = pct + '%';
  updateShopAffordability();
  updateSpinBtn();
}

function animateCounter(el, from, to) {
  if (from === to) return;
  var duration = 600;
  var start = performance.now();
  function step(now) {
    var t = Math.min(1, (now - start) / duration);
    t = 1 - Math.pow(1 - t, 3);
    var val = Math.round(from + (to - from) * t);
    el.textContent = val.toLocaleString('ru-RU');
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateSpinBtn() {
  var btn = document.getElementById('spinBtn');
  var info = document.getElementById('spinHint');
  if (state.spinning) {
    btn.disabled = true;
    info.textContent = '🎰 Spinning...';
    info.className = 'spin-hint';
    return;
  }
  if (state.energy < 1) {
    btn.disabled = true;
    info.textContent = '⚡ No energy. Restore in 5 min';
    info.className = 'spin-hint warn';
    return;
  }
  btn.disabled = false;
  info.textContent = 'Tap the golden button';
  info.className = 'spin-hint';
}

function spin() {
  if (state.spinning) return;
  if (state.energy < 1) {
    showToast('⚡ No energy', 'error');
    haptic('error');
    return;
  }
  state.spinning = true;
  updateSpinBtn();
  haptic('medium');

  apiPost('/api/quiz/spin', { userId: user.id }).then(function(data) {
    var idx = SEGMENTS.findIndex(function(s) { return s.points === data.level; });
    if (idx === -1) idx = 0;
    spinWheelTo(idx);
    state.energy = data.energy;
    state.currentSpin = data;
    renderProfile();
    setTimeout(function() { showQuestion(data); }, 4800);
  }).catch(function(err) {
    state.spinning = false;
    updateSpinBtn();
    showToast(err.error || 'Error', 'error');
    haptic('error');
  });
}

function showQuestion(data) {
  document.getElementById('screen-spin').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-question').classList.remove('hidden');

  document.getElementById('questionLevel').textContent = data.level + ' Points';
  document.getElementById('questionText').textContent = data.question;

  var letters = ['A', 'B', 'C', 'D'];
  var html = '';
  for (var i = 0; i < data.answers.length; i++) {
    html += '<button class="answer" data-idx="' + i + '">' +
      '<span class="letter">' + letters[i] + '</span>' +
      '<span>' + escapeHtml(data.answers[i]) + '</span>' +
      '</button>';
  }
  document.getElementById('answers').innerHTML = html;
  document.querySelectorAll('.answer').forEach(function(b) {
    b.addEventListener('click', function() { answer(parseInt(b.getAttribute('data-idx'))); });
  });
  state.answered = false;
  haptic('light');
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  var btns = document.querySelectorAll('.answer');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });

  apiPost('/api/quiz/answer', {
    userId: user.id,
    token: state.currentSpin.token,
    answer: idx,
  }).then(function(res) {
    if (btns[res.correctAnswer]) btns[res.correctAnswer].classList.add('correct');
    if (!res.correct && btns[idx]) btns[idx].classList.add('wrong');
    state.balance = res.balance;
    renderProfile();
    setTimeout(function() { showResult(res); }, 1500);
  }).catch(function(err) {
    showToast(err.error || 'Error', 'error');
    backToSpin();
  });
}

function showResult(res) {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  if (res.correct) {
    document.getElementById('resultIcon').textContent = '🏆';
    document.getElementById('resultTitle').textContent = 'Correct!';
    document.getElementById('resultTitle').className = 'result-title win';
    document.getElementById('resultSub').textContent = 'Great answer';
    var p = document.getElementById('resultPoints');
    p.innerHTML = '<span class="num">+' + res.points + '</span><span class="star">⭐</span>';
    p.className = 'points-badge';
    playSound('win');
    haptic('success');
    launchConfetti();
  } else {
    document.getElementById('resultIcon').textContent = '💔';
    document.getElementById('resultTitle').textContent = 'Wrong';
    document.getElementById('resultTitle').className = 'result-title lose';
    document.getElementById('resultSub').textContent = 'Not this time';
    var p2 = document.getElementById('resultPoints');
    p2.innerHTML = '<span class="num">+0</span><span class="star">⭐</span>';
    p2.className = 'points-badge zero';
    playSound('error');
    haptic('error');
  }
}

function backToSpin() {
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-spin').classList.remove('hidden');
  state.spinning = false;
  state.answered = false;
  updateSpinBtn();
  loadProfile();
}

function launchConfetti() {
  var c = document.getElementById('confetti');
  var colors = ['#f6d78a', '#e8c268', '#a78bfa', '#f472b6', '#4ade80', '#60a5fa'];
  for (var i = 0; i < 80; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = '-20px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    c.appendChild(piece);
    setTimeout(function(p) { return function() { p.remove(); }; }(piece), 4200);
  }
}

function loadGifts() {
  apiGet('/api/quiz/gifts').then(function(gifts) {
    state.gifts = gifts;
    renderShop();
  }).catch(function(e) { console.error(e); });
}

function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = '';
  for (var i = 0; i < state.gifts.length; i++) {
    var g = state.gifts[i];
    var affordable = state.balance >= g.price;
    html += '<div class="gift-card ' + (affordable ? 'affordable' : '') + '" data-gift="' + g.id + '">' +
      '<div class="gift-check">✓</div>' +
      '<span class="gift-emoji">' + g.emoji + '</span>' +
      '<div class="gift-name">' + escapeHtml(g.name) + '</div>' +
      '<div class="gift-price">⭐ ' + g.price + '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.gift-card').forEach(function(c) {
    c.addEventListener('click', function() { buyGift(c.getAttribute('data-gift')); });
  });
}

function updateShopAffordability() {
  var cards = document.querySelectorAll('.gift-card');
  for (var i = 0; i < cards.length; i++) {
    var priceEl = cards[i].querySelector('.gift-price');
    if (!priceEl) continue;
    var price = parseInt(priceEl.textContent.replace(/\D/g, ''));
    if (state.balance >= price) cards[i].classList.add('affordable');
    else cards[i].classList.remove('affordable');
  }
}

function buyGift(giftId) {
  var gift = state.gifts.find(function(g) { return g.id === giftId; });
  if (!gift) return;
  if (state.balance < gift.price) {
    showToast('Not enough points', 'error');
    haptic('error');
    return;
  }
  if (!confirm('Exchange ' + gift.price + ' ⭐ for ' + gift.emoji + ' ' + gift.name + '?')) return;
  haptic('medium');

  apiPost('/api/quiz/exchange', {
    userId: user.id,
    giftId: giftId,
    firstName: user.first_name || '',
    username: user.username || '',
  }).then(function(res) {
    if (res.error) { showToast(res.error, 'error'); return; }
    state.balance = res.balance;
    renderProfile();
    haptic('success');
    launchConfetti();
    showModal(gift.emoji, 'Order placed!', 'The admin will send your gift in Telegram shortly 🎁');
    loadProfile();
    loadHistory();
  }).catch(function(err) {
    showToast(err.error || 'Error', 'error');
    haptic('error');
  });
}

function loadHistory() {
  apiGet('/api/quiz/exchanges/' + user.id).then(function(list) {
    var el = document.getElementById('historyList');
    if (!list || list.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🎁</div><div class="empty-title">Nothing yet</div><div class="empty-sub">Buy gifts in the shop</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var fulfilled = e.status === 'fulfilled';
      var statusText = fulfilled ? 'Delivered' : 'Pending';
      html += '<div class="history-card ' + (fulfilled ? 'fulfilled' : '') + '">' +
        '<div class="history-emoji">' + e.giftEmoji + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + escapeHtml(e.giftName) + '</div>' +
          '<div class="history-date">' + formatDate(e.date) + '</div>' +
          '<span class="history-status ' + (fulfilled ? 'fulfilled' : 'pending') + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="history-price">⭐ ' + e.price + '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  }).catch(function(e) { console.error(e); });
}

function showToast(text, type) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast';
  if (type) t.classList.add(type);
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 2400);
}

function showModal(emoji, title, text) {
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function formatDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.35);
    });
  } else if (type === 'error') {
    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.22);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.28);
  }
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    var tab = t.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x === t); });
    document.getElementById('view-play').classList.toggle('hidden', tab !== 'play');
    document.getElementById('view-shop').classList.toggle('hidden', tab !== 'shop');
    document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
    haptic('light');
    if (tab === 'shop') renderShop();
    if (tab === 'history') loadHistory();
  });
});

document.getElementById('spinBtn').addEventListener('click', function() {
  initAudio();
  spin();
});

setInterval(loadProfile, 60000);

drawWheel();
loadProfile();
loadGifts();
loadHistory();
</script>
</body>
</html>
